# SPDX-License-Identifier: AGPL-3.0-only
#
# Shared golangci-lint v2 config for all Go modules (services/host-agent,
# apps, cli). golangci-lint walks up from each module dir to find this,
# so one file at the repo root governs every module.
#
# Baseline state, verified 2026-10-04: all three modules report 0 issues at
# the caps below with golangci-lint v2.13.2.
#
# An earlier revision of this header carried a per-linter measurement
# (cyclop "21 non-test functions over", funlen "worst 107 lines", nestif
# "5 sites over"). None of it still describes the tree: CallbackHandler is
# 41 lines, not 107, and nothing is over the cyclop cap. The debt got repaid
# and the prose did not follow. That is the reason not to restate measured
# numbers here. A number in a comment is a claim with no check behind it, so
# it rots silently and then misleads the next reader about how much room the
# tree has. The caps below are the rule; running the linter is the
# measurement. Cyclop reports only when the value is STRICTLY above the
# threshold, so a cap equal to the worst value still passes.
#
# Tests are excluded from funlen (see exclusions): a table-driven test
# legitimately runs long, and the cap is about production code.
#
# Three linters beyond the size caps gate mechanical drift:
#   - unconvert: a redundant type conversion is a leftover from a type
#     change or an over-eager write; it costs a reader a double-take for
#     nothing. No false positives worth naming.
#   - usestdlibvars: a string or number literal where the standard library
#     names the constant ("GET", 200) is a spelling mistake waiting to
#     diverge from http.MethodGet / http.StatusOK. No false positives worth
#     naming.
#   - unparam: a parameter a function never reads, or a result that is
#     always nil or always one value, is dead code that mis-states the
#     function's contract. It is excluded from tests (see exclusions): a
#     table-driven test helper is often parameterised one step beyond its
#     call sites for readability, and unparam cannot tell that apart from a
#     production function whose parameter is simply dead. The one
#     production exception is //nolint'd at its site with the reason.
#
# Not enabled, and why: `lll` (line length) measures 212 non-test and 202
# test lines over 120 columns, spread across 63 non-test files, which is a
# mechanical wrap of a different scale than the rest of this list. Comment
# lines are not the cause: zero non-test comment lines exceed 120 columns.
version: "2"

linters:
  enable:
    - cyclop
    - forbidigo
    - funlen
    - nestif
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    cyclop:
      # Fail any function with cyclomatic complexity > 15.
      max-complexity: 15
      # Fail any package whose average function complexity > 7.0.
      package-average: 7.0
    funlen:
      # Fail a function longer than 60 code lines or 40 statements.
      # Comment lines do not count against the length: a documented
      # function is not penalised for its docs.
      lines: 60
      statements: 40
      ignore-comments: true
    nestif:
      # Fail an if-block whose nested complexity exceeds 5: the depth
      # counterpart to cyclop, which counts branches but not nesting.
      min-complexity: 5
    nolintlint:
      # A suppression with no explanation is indistinguishable from one that
      # papered over a bug at 6pm, and a suppression that suppresses nothing
      # is dead code that outlives the reason it was written. Both fail here,
      # for the same reason an exception in pinned-images.mjs that matches
      # nothing fails: an exemption has to keep describing the code, or it is
      # worse than no exemption at all. Without this linter the tree can drift
      # from 5 explained directives to 30 unexplained ones and every other
      # rule in this file quietly stops mattering.
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      # One rule, deliberately: indent-error-flow is the Go equivalent of
      # eslint's no-else-return with allowElseIf disabled. An if block that
      # ends in return/break/continue/panic needs no else; the else only
      # pushes the live path one indent level deeper. Revive's other rules
      # are not enabled here: the default set is a naming-and-doc style
      # sweep, not a size gate, and it is not what this config is for.
      rules:
        - name: indent-error-flow
    forbidigo:
      # App configurators integrate with their app through sanctioned helpers:
      # pkg/managedfile for generated files, pkg/appclient for HTTP, and
      # Deps.Exec / Deps.RestartContainer for commands inside containers.
      # Direct stdlib shortcuts reintroduce the failure modes those helpers
      # exist to remove (non-atomic writes, missing timeouts, uncancellable
      # exec), so they are forbidden in the apps module. The exclusions below
      # scope forbidigo to apps/**/*.go: host-agent and cli legitimately write
      # files and spawn processes. A single-site exception is a
      # `//nolint:forbidigo // reason` on the line.
      #
      # analyze-types resolves the called package, so the rule still fires when
      # an import is aliased and can distinguish http.Client.Do from
      # appclient's Call.Do.
      analyze-types: true
      forbid:
        # Generated config files go through pkg/managedfile.Write (atomic,
        # change-detecting, parent-dir creating).
        - pattern: '^os\.(WriteFile|Create|CreateTemp|OpenFile)$'
          msg: 'write generated files through pkg/managedfile.Write'
        - pattern: '^ioutil\.(WriteFile|TempFile)$'
          msg: 'write generated files through pkg/managedfile.Write'
        # Commands inside containers go through Deps.Exec (output + env) or
        # Deps.RestartContainer; the configurator holds no podman handle.
        - pattern: '^exec\.Command(Context)?$'
          msg: 'run commands through Deps.Exec / Deps.RestartContainer'
        # App HTTP goes through pkg/appclient (typed requests, retries,
        # readiness waits); its Call.Do(ctx) is the sanctioned terminal.
        - pattern: '^http\.(NewRequest|DefaultClient|Client)$'
          msg: 'call app HTTP through pkg/appclient'
        - pattern: '^http\.Client\.Do$'
          msg: 'call app HTTP through pkg/appclient'
  exclusions:
    rules:
      # forbidigo targets app configurators: tests and the host-agent/cli
      # modules legitimately write files and spawn processes. Paths are
      # module-relative (apps/, services/host-agent/, cli/). unparam joins
      # the test exclusion because a test helper is often generalised past
      # its current call sites on purpose (see the header).
      - path: '_test\.go$'
        linters: [forbidigo, funlen, unparam]
      - path: '^(services|cli)/'
        linters: [forbidigo]

issues:
  # Report the full totality of issues: never cap per linter or collapse
  # identical messages. Collapsed counts hide how many call sites actually
  # need fixing, so the default truncation is disabled repo-wide.
  max-issues-per-linter: 0
  max-same-issues: 0
