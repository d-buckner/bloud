<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<!-- Reload until the dashboard is ready; host-agent serves this page
		     only while the orchestrator is still converging the system apps. -->
		<meta http-equiv="refresh" content="2" />
		<title>Bloud is starting</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			html,
			body {
				height: 100%;
			}
			body {
				margin: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #0f1115;
				color: #e7e9ee;
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
			}
			main {
				text-align: center;
				padding: 2rem;
			}
			.spinner {
				width: 40px;
				height: 40px;
				margin: 0 auto 1.5rem;
				border: 3px solid rgba(231, 233, 238, 0.2);
				border-top-color: #e7e9ee;
				border-radius: 50%;
				animation: spin 0.9s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			h1 {
				margin: 0 0 0.5rem;
				font-size: 1.25rem;
				font-weight: 600;
			}
			p {
				margin: 0;
				opacity: 0.7;
				font-size: 0.9rem;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="spinner" role="status" aria-label="Starting"></div>
			<h1>Bloud is starting</h1>
			<p>Bringing up the proxy, single sign-on, and databases. This page refreshes by itself.</p>
		</main>
	</body>
</html>
