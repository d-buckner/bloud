#
# Thin CI shell -- the Forgejo mirror of .github/workflows/ci.yml. Same
# contract: all validation logic lives in validation.yaml and runs through
# ./bloud validate. Change one, change the other.
name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: docker
    container:
      image: golang:1.25-alpine
    steps:
      # build-base carries the C toolchain: the prose lint builds Vale from
      # source (pinned via `go run`), and its tree-sitter dependency needs cgo.
      # The alpine image ships no compiler once its own build stage is discarded.
      - name: Install Node.js and a C toolchain
        run: apk add --no-cache nodejs npm git build-base

      - name: Checkout
        # Stays on v4 on purpose: the Node 20 deprecation notice comes from the
        # GitHub runner, and this job runs on the Forgejo runner, which controls
        # its own action runtime. Bump it when that runtime ships Node 24.
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build the bloud CLI
        run: npm run cli:build

      - name: Validate (fast tier)
        run: ./bloud validate --tier fast
