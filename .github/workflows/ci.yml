#
# Thin CI shell. Every check is defined once, in validation.yaml, and executed
# by ./bloud validate. Do NOT add test, lint, or build steps here -- add a
# command to validation.yaml instead, so local runs and CI stay identical.
#
# The fast tier covers: host-agent tests, orchestrator race tests, apps tests,
# cli tests, golangci-lint (cyclop), web unit tests, svelte-check, ESLint,
# the static production build, and the license-header check.
name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            services/host-agent/go.sum
            apps/go.sum
            cli/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the bloud CLI
        run: npm run cli:build

      - name: Validate (fast tier)
        run: ./bloud validate --tier fast
