name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/host-agent/go.sum

      - name: Build host-agent
        working-directory: services/host-agent
        run: go build ./...

      - name: Run unit tests
        working-directory: services/host-agent
        run: go test ./...

      - name: Build CLI
        working-directory: cli
        run: go build ./...

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=services/host-agent/web

      - name: Run frontend tests
        run: npm test --workspace=services/host-agent/web --if-present
