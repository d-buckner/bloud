# SPDX-License-Identifier: AGPL-3.0-only
#
# Thin CI shell. Every check is defined once, in validation.yaml, and executed
# by ./bloud validate. Do NOT add test, lint, or build steps here -- add a
# command to validation.yaml instead, so local runs and CI stay identical.
#
# This job runs the changed tier: the subset of the fast tier that the pushed
# files actually trigger, inferred from the same validation.yaml paths the
# local default and the pre-push hook use. A feature-branch push diffs from the
# merge base with main (the whole PR, not just the last commit); a main push
# diffs from the previous tip; and a run with no base at all (workflow_dispatch
# on main) falls back to the full fast tier. The inference is complete by
# construction: the `**` catch-all always runs the whole-tree checks, and a
# change to a root config or script file triggers the full tier.
name: CI

on:
  workflow_dispatch:
  push:

jobs:
  validate:
    # Pinned rather than `ubuntu-latest`: the label migrates to Ubuntu 26 in
    # October 2026, and the runner image is part of this job's contract.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `git merge-base origin/main HEAD` can resolve the
          # PR's diff base on a feature-branch push.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: |
            services/host-agent/go.sum
            apps/go.sum
            cli/go.sum

      # setup-go v7 exports GOTOOLCHAIN=local, which stops Go from downloading a
      # newer toolchain on demand. The fast tier needs that switch: golangci-lint
      # v2.13.2 requires Go >= 1.26, while this job installs 1.25 for the tests.
      # Written after setup-go so it wins over the action's own export.
      - name: Allow the lint toolchain switch
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the bloud CLI
        run: npm run cli:build

      - name: Validate (changed tier)
        env:
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            base="$(git merge-base origin/main HEAD)"
            ./bloud validate --tier changed --since "$base"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            ./bloud validate --tier changed --since "$BEFORE"
          else
            ./bloud validate --tier fast
          fi
