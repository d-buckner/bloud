# SPDX-License-Identifier: AGPL-3.0-only
#
# Thin CI shell. Every check is defined once, in validation.yaml, and executed
# by ./bloud validate. Do NOT add test, lint, or build steps here -- add a
# command to validation.yaml instead, so local runs and CI stay identical.
#
# The fast tier covers: host-agent tests, orchestrator race tests, apps tests,
# cli tests, golangci-lint (cyclop), gofmt, web unit tests, svelte-check, ESLint,
# the static production build, the license-header check, the prose lint (Vale,
# docs plus source comments), the em dash check, and the docs link check.
name: CI

on:
  workflow_dispatch:
  push:

jobs:
  validate:
    # Pinned rather than `ubuntu-latest`: the label migrates to Ubuntu 26 in
    # October 2026, and the runner image is part of this job's contract.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: |
            services/host-agent/go.sum
            apps/go.sum
            cli/go.sum

      # setup-go v7 exports GOTOOLCHAIN=local, which stops Go from downloading a
      # newer toolchain on demand. The fast tier needs that switch: golangci-lint
      # v2.13.2 requires Go >= 1.26, while this job installs 1.25 for the tests.
      # Written after setup-go so it wins over the action's own export.
      - name: Allow the lint toolchain switch
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the bloud CLI
        run: npm run cli:build

      - name: Validate (fast tier)
        run: ./bloud validate --tier fast
