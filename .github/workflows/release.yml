#
# Release packaging: builds the production .deb. This is not a validation check
# (those live in validation.yaml and run through ./bloud validate); it produces
# the artifact a release is cut from. The local equivalent is ./bloud package.
name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `git describe --tags` resolves a real version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: |
            services/host-agent/go.sum
            apps/go.sum
            cli/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the bloud CLI
        run: npm run cli:build

      - name: Package the .deb
        run: ./bloud package --arch amd64

      - name: Upload the .deb
        uses: actions/upload-artifact@v7
        with:
          name: bloud-deb
          path: dist/*.deb
          if-no-files-found: error
