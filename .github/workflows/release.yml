# SPDX-License-Identifier: AGPL-3.0-only
#
# Release packaging: builds the production .deb and publishes it as a GitHub
# pre-release, tagged deb-<UTC timestamp> (a .deb build, distinct from the ISO
# image releases).
#
# This repository has GitHub's release immutability setting enabled, so every
# release published here is immutable: once published, its assets cannot be
# added, replaced, or deleted, and its tag cannot be moved. That is the point,
# and it is also why there is no rolling fixed-name asset on this workflow. A
# rolling asset would have to be overwritten on every push, which immutability
# forbids: the upload fails with HTTP 422, "Cannot upload assets to an
# immutable release". The create-release API has no per-release opt-out, so the
# setting cannot be worked around from here either.
#
# So each push publishes exactly one immutable release, and install.sh resolves
# the newest one through the releases API at install time. The last step below
# asserts that the resolver actually picks the build this run published, which
# is the check that would have caught the original breakage.
#
# Runs on pushes to main, plus manual dispatch. This is not a validation check
# (those live in validation.yaml and run through ./bloud validate); it produces
# the artifact a release is cut from. The local equivalent is ./bloud package.
name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

# gh release create needs to write releases and tags.
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `git describe --tags` resolves a real version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: |
            services/host-agent/go.sum
            apps/go.sum
            cli/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the bloud CLI
        run: npm run cli:build

      - name: Package the .deb
        run: ./bloud package --arch amd64

      # Kept alongside the release so the raw build is inspectable from the run.
      - name: Upload the .deb as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: bloud-deb
          path: dist/*.deb
          if-no-files-found: error

      # Computed once and shared: the publish step tags the release with it, and
      # the verify step asserts the installer resolves that same tag.
      - name: Compute the release tag
        id: tag
        run: echo "tag=deb-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Publish a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="$(date -u +%Y-%m-%d)"
          sha="$(git rev-parse --short HEAD)"
          gh release create "${{ steps.tag.outputs.tag }}" dist/*.deb \
            --title "bloud ${day} (${sha})" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes "Automated build of the Bloud .deb from ${GITHUB_SHA}."

      # install.sh resolves the newest published .deb rather than following a
      # rolling fixed-name asset, so this is where the two are checked against
      # each other. A release is not guaranteed to be visible in the list
      # endpoint the instant the create call returns, so retry before failing.
      - name: Verify install.sh resolves this build
        id: resolved
        run: |
          published="${{ steps.tag.outputs.tag }}"
          resolved=""
          for attempt in 1 2 3 4 5; do
            candidate="$(BLOUD_INSTALL_URL_ONLY=1 sh ./install.sh || true)"
            case "$candidate" in
              */"$published"/*)
                resolved="$candidate"
                break
                ;;
            esac
            echo "attempt ${attempt} resolved '${candidate:-<nothing>}'"
            sleep 10
          done
          if [ -z "$resolved" ]; then
            echo "::error::install.sh did not resolve the release just published (${published})"
            exit 1
          fi
          echo "install.sh resolves this build: ${resolved}"
          echo "url=${resolved}" >> "$GITHUB_OUTPUT"

      - name: Record the install command in the job summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ASSET: ${{ steps.resolved.outputs.url }}
        run: |
          {
            printf '## Release %s\n\n' "$TAG"
            printf 'Install:\n\n'
            printf '```sh\n'
            printf 'curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh | sudo sh\n' \
              "$GITHUB_REPOSITORY"
            printf '```\n\n'
            printf 'Resolved asset: %s\n' "$ASSET"
          } >> "$GITHUB_STEP_SUMMARY"
