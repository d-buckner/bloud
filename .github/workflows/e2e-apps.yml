name: E2E Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

# One self-contained Bloud runtime per app, running in parallel.
#
# Each matrix leg provisions its own host on the runner (the native
# backend), boots the full system stack (Traefik + Authentik), installs
# exactly one app through the real host-agent API, and runs that app's
# Playwright spec. Image pulls happen concurrently across runners
# instead of sequentially on one, so total wall time is the slowest
# single app rather than the sum of all apps.
#
# Leg 0 is the install-streaming UI contract (jellyfin install flow).
# The debug-status-labels spec is excluded: it is a manual debugging
# tool, not a regression gate.
jobs:
  e2e-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app:
          - jellyfin
          - navidrome
          - immich
          - affine
          - appflowy
          - install-streaming
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/host-agent/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Enable user-level systemd (linger)
        run: |
          sudo loginctl enable-linger "$USER"
          sleep 2
          test -S "$XDG_RUNTIME_DIR/systemd/private"

      - name: Build CLI
        working-directory: cli
        run: go build -o ../bloud .

      - name: Run E2E for ${{ matrix.app }} (native backend)
        id: e2e
        env:
          BLOUD_BACKEND: native
          BLOUD_E2E_KEEP: "1"
          BLOUD_E2E_APP: ${{ matrix.app }}
          BLOUD_URL: http://localhost:8080
          BLOUD_API_URL: http://localhost:3000
        run: |
          # install-streaming has its own spec; everything else maps
          # 1:1 to <app>.spec.ts.
          if [ "${{ matrix.app }}" = "install-streaming" ]; then
            FILTER="install-streaming"
          else
            FILTER="${{ matrix.app }}"
          fi
          BLOUD_E2E_PLAYWRIGHT_FILTER="$FILTER" ./bloud e2e app

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.app }}-results
          path: e2e/test-results
          retention-days: 7

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== User systemd units ==="
          systemctl --user list-units --all --no-pager 2>&1 || true
          echo "=== Unit file ==="
          cat ~/.config/systemd/user/bloud-e2e-host-agent.service 2>&1 || echo "not found"
          echo "=== Systemctl status ==="
          systemctl --user status bloud-e2e-host-agent.service --no-pager 2>&1 || true
          echo "=== Journal ==="
          journalctl --user -u bloud-e2e-host-agent.service --no-pager -n 200 2>&1 || true
          echo "=== Podman containers ==="
          podman ps -a 2>&1 || true
          echo "=== Podman socket ==="
          systemctl --user status podman.socket --no-pager 2>&1 || true
          echo "=== Runtime dir ==="
          ls -la /var/tmp/bloud-e2e-runtime/ 2>&1 || true
          echo "=== Host-agent binary ==="
          file /var/tmp/bloud-e2e-runtime/host-agent/host-agent 2>&1 || true
          echo "=== Ports ==="
          ss -tlnp 2>&1 || true
