# SPDX-License-Identifier: AGPL-3.0-only
#
# Keeps every generated doc current. On every merge to main it rewrites the
# README's catalog list, its one-login table, and the dependency graph
# diagram, then commits the results.
#
# Three artifacts, one source: apps/*/metadata.yaml. `bloud catalogdoc
# --write` rewrites the two README blocks between their markers; `bloud
# depgraph --write` rewrites the graph block in the README's "the full
# graph" section. The diagram is Mermaid, which GitHub renders inline, so
# the committed bytes are the picture and nothing has to draw it. An earlier
# shape of this job rendered the graph as a PNG in a headless browser using
# the dashboard's own components; that made the artifact a binary blob that
# CI had to build a frontend and install Chromium to produce, and a reader
# could not see the topology in the diff. The Mermaid block replaced it.
#
# The PR-time gate is `./bloud depgraph --check` and `./bloud catalogdoc
# --check` in the fast validation tier; this job is the safety net that
# leaves main correct even when a PR forgot to regenerate. The commit is
# marked [skip ci] so the generated commit does not kick off another full
# validation pass.
#
# The trigger is scoped to the inputs of the artifacts: the catalog they
# depict, and the code that draws them. A push to main that touches neither
# leaves the committed artifacts alone, which is the point of generating them
# once instead of redrawing on every merge.
name: Generated docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # What the artifacts depict: the catalog topology and per-app metadata.
      - 'apps/**/metadata.yaml'
      # The generators that write the README blocks and the graph diagram.
      - 'cli/depgraph.go'
      - 'cli/catalogdoc.go'
      - 'cli/genblock.go'
      - '.github/workflows/generated-docs.yml'

permissions:
  contents: write

concurrency:
  group: generated-docs-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The branch tip, not a detached commit: this job commits back.
          ref: refs/heads/main
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the bloud CLI
        run: npm run cli:build

      - name: Refresh the dependency graph diagram
        run: ./bloud depgraph --write

      - name: Refresh the README blocks
        run: ./bloud catalogdoc --write

      - name: Commit the refresh
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "generated docs already current; nothing to commit"
            exit 0
          fi
          git config user.name "generated docs bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit --no-verify -m "docs: refresh generated docs [skip ci]"
          git push origin HEAD:main
