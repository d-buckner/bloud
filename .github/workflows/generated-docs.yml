# SPDX-License-Identifier: AGPL-3.0-only
#
# Keeps every generated doc current. On every merge to main it rewrites the
# README's catalog list and one-login table, rewrites the text form of the
# dependency graph, renders the graph picture in a headless browser, and
# commits the results.
#
# Three artifacts, one source: apps/*/metadata.yaml. `bloud catalogdoc
# --write` rewrites the two README blocks between their markers; `bloud
# depgraph --write` rewrites the graph in
# docs/architecture/dependency-graph.md; and the picture is the dashboard's
# own developer graph: the same Svelte components and the same dagre layout,
# fed a snapshot of the whole catalog (`bloud depgraph --json`, which emits
# the shape /api/system/developer returns) instead of one instance's
# installed apps. Rendering it in a real browser is what makes the README
# image and the dashboard the same drawing rather than two descriptions of it.
#
# The PR-time gate is `./bloud depgraph --check` and `./bloud catalogdoc
# --check` in the fast validation tier; this job is the safety net that
# leaves main correct even when a PR forgot to regenerate. The commit is
# marked [skip ci] so the generated commit does not kick off another full
# validation pass.
#
# The trigger is scoped to the inputs of the artifacts: the catalog they
# depict, and the code that draws them. A push to main that touches neither
# leaves the committed artifacts alone, which is the point of generating them
# once instead of redrawing on every merge.
name: Generated docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # What the artifacts depict: the catalog topology and per-app metadata.
      - 'apps/**/metadata.yaml'
      # The generators that write the README blocks and the text graph.
      - 'cli/depgraph.go'
      - 'cli/catalogdoc.go'
      - 'cli/genblock.go'
      # What draws the picture. A change here can change the pixels without
      # changing the catalog, so the committed image has to follow it too.
      - 'services/host-agent/web/src/routes/graph/**'
      - 'services/host-agent/web/src/lib/graph/**'
      - 'services/host-agent/web/src/lib/timeline/graphLayout.ts'
      - 'services/host-agent/web/src/lib/utils/statusColor.ts'
      - 'scripts/render-graph.mjs'
      - '.github/workflows/generated-docs.yml'

permissions:
  contents: write

concurrency:
  group: generated-docs-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The branch tip, not a detached commit: this job commits back.
          ref: refs/heads/main
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the bloud CLI
        run: npm run cli:build

      - name: Refresh the text graph
        run: ./bloud depgraph --write

      - name: Refresh the README blocks
        run: ./bloud catalogdoc --write

      - name: Derive the catalog snapshot
        run: |
          set -euo pipefail
          mkdir -p .bloud
          ./bloud depgraph --json > .bloud/catalog-graph.json
          node -e '
            const g = JSON.parse(require("fs").readFileSync(".bloud/catalog-graph.json", "utf8"));
            if (!g.nodes?.length) throw new Error("empty catalog snapshot");
            console.log(`snapshot: ${g.nodes.length} nodes, ${g.edges.length} edges`);
          '

      - name: Build the frontend
        run: npm run build --workspace=@bloud/host-agent-web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render the README image in a browser
        run: |
          set -euo pipefail
          node scripts/render-graph.mjs \
            --graph .bloud/catalog-graph.json \
            --output docs/assets/dependency-graph.png

      - name: Commit the refresh
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md docs/architecture/dependency-graph.md docs/assets/dependency-graph.png; then
            echo "generated docs already current; nothing to commit"
            exit 0
          fi
          git config user.name "generated docs bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture/dependency-graph.md docs/assets/dependency-graph.png
          git commit --no-verify -m "docs: refresh generated docs [skip ci]"
          git push origin HEAD:main
