name: Smoke Test

on:
  workflow_run:
    workflows: [Build ISO]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Update Playwright baseline snapshots'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, bloud-builder]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CLI
        run: npm run cli:build

      - name: Get ISO URL
        id: iso
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(gh release view latest --json assets \
            --jq '[.assets[] | select(.name | endswith(".iso"))] | last | .url')
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Run smoke tests
        env:
          BLOUD_PVE_HOST: ${{ secrets.BLOUD_PVE_HOST }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.update-snapshots }}" = "true" ]; then
            EXTRA_FLAGS="--update-snapshots"
          fi
          ./bloud smoke --iso-url "${{ steps.iso.outputs.url }}" $EXTRA_FLAGS

      - name: Upload updated snapshots
        if: inputs.update-snapshots == true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots-linux
          path: smoke/tests/**/*-linux.png
