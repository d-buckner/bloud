name: E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/host-agent/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Enable user-level systemd (linger)
        run: |
          sudo loginctl enable-linger "$USER"
          sleep 2
          test -S "$XDG_RUNTIME_DIR/systemd/private"

      - name: Build CLI
        working-directory: cli
        run: go build -o ../bloud .

      - name: Run E2E lifecycle (native backend)
        id: e2e
        env:
          BLOUD_BACKEND: native
          BLOUD_E2E_KEEP: "1"
          BLOUD_URL: http://localhost:8080
          BLOUD_API_URL: http://localhost:3000
        run: ./bloud e2e lifecycle

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== User systemd units ==="
          systemctl --user list-units --all --no-pager 2>&1 || true
          echo "=== Unit file ==="
          cat ~/.config/systemd/user/bloud-e2e-host-agent.service 2>&1 || echo "not found"
          echo "=== Systemctl status ==="
          systemctl --user status bloud-e2e-host-agent.service --no-pager 2>&1 || true
          echo "=== Journal ==="
          journalctl --user -u bloud-e2e-host-agent.service --no-pager -n 100 2>&1 || true
          echo "=== Podman socket ==="
          systemctl --user status podman.socket --no-pager 2>&1 || true
          echo "=== Runtime dir ==="
          ls -la /var/tmp/bloud-e2e-runtime/ 2>&1 || true
          echo "=== Host-agent binary ==="
          file /var/tmp/bloud-e2e-runtime/host-agent/host-agent 2>&1 || true
          echo "=== Podman info ==="
          podman info 2>&1 | head -20 || true
          echo "=== Ports ==="
          ss -tlnp 2>&1 || true
