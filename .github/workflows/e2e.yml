name: E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/host-agent/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Enable user-level systemd (linger)
        run: |
          sudo loginctl enable-linger "$USER"
          sleep 2
          # Verify the user systemd socket is available
          test -S "$XDG_RUNTIME_DIR/systemd/private"

      - name: Build CLI
        working-directory: cli
        run: go build -o ../bloud .

      - name: Run E2E lifecycle (native backend)
        env:
          BLOUD_BACKEND: native
          BLOUD_URL: http://localhost:8080
          BLOUD_API_URL: http://localhost:3000
        run: ./bloud e2e lifecycle
