tiers:
  fast:
    commands:
      - id: go-host-agent
        cwd: services/host-agent
        run: go test ./...
      - id: go-host-agent-race
        cwd: services/host-agent
        run: go test -race ./internal/orchestrator/...
      - id: go-apps
        cwd: apps
        run: go test ./...
      - id: go-cli
        cwd: cli
        run: go test ./...
      - id: web-unit
        cwd: .
        run: npm run test --workspace=@bloud/host-agent-web
      - id: web-check-host-agent
        cwd: .
        run: npm run check --workspace=@bloud/host-agent-web

  integration:
    commands:
      - id: e2e-host-agent
        cwd: services/host-agent
        run: go test -count=1 -tags integration -timeout 300s ./internal/e2e/...

inference:
  paths:
    - pattern: "services/host-agent/web/**"
      triggers: [web-unit, web-check-host-agent]
    - pattern: "services/host-agent/**"
      triggers: [go-host-agent, go-host-agent-race]
    - pattern: "apps/**"
      triggers: [go-apps]
      riskAreas: [app-install, embed]
    - pattern: "cli/**"
      triggers: [go-cli]
    - pattern: "nixos/**"
      triggers: []
      riskAreas: [nix-module]
    - pattern: "flake.nix"
      triggers: []
      riskAreas: [nix-module]
    - pattern: "e2e/**"
      triggers: []
      riskAreas: [playwright]

apps:
  immich:
    auth: native-oidc
    validation-level: embed
    files:
      - apps/immich/**

  miniflux:
    auth: native-oidc
    validation-level: full
    files:
      - apps/miniflux/**

  jellyfin:
    auth: ldap
    validation-level: full
    files:
      - apps/jellyfin/**
    e2e-project: jellyfin

  qbittorrent:
    auth: forward-auth
    validation-level: embed
    files:
      - apps/qbittorrent/**

  adguard-home:
    auth: none
    validation-level: embed
    files:
      - apps/adguard-home/**
