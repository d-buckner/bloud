tiers:
  fast:
    commands:
      - id: go-host-agent
        cwd: services/host-agent
        run: go test ./...
      - id: go-host-agent-race
        cwd: services/host-agent
        run: go test -race ./internal/engine/orchestrator/... ./internal/catalog/...
      - id: go-apps
        cwd: apps
        run: go test ./...
      - id: go-cli
        cwd: cli
        run: go test ./...
      - id: go-lint
        cwd: .
        run: npm run lint:go
      # gofmt owns Go layout, and nothing enforced it before, so the tree had
      # drifted (20 files when this command landed).
      - id: gofmt
        cwd: .
        run: npm run check:gofmt
      - id: web-unit
        cwd: .
        run: npm run test --workspace=@bloud/host-agent-web
      - id: web-check-host-agent
        cwd: .
        run: npm run check --workspace=@bloud/host-agent-web
      - id: web-lint
        cwd: .
        run: npm run lint:web
      # The static bundle is the artifact host-agent actually serves
      # (invariant 11), so a broken production build is a real failure --
      # typecheck alone does not catch adapter/build-time errors.
      - id: web-build
        cwd: .
        run: npm run build --workspace=@bloud/host-agent-web
      - id: license-headers
        cwd: .
        run: npm run license:check
      # Every container image Bloud runs has to name a specific version. A
      # rolling tag (`:latest`, `:release`, `:stable`) is republished upstream,
      # so an install is not reproducible and a bump is not reviewable. The
      # check reads the catalog and the Go image constants, and prints its
      # declared exceptions on every run.
      - id: image-pins
        cwd: .
        run: npm run check:image-pins
      # File length is a ratchet, not a cap. The files already over 500 code
      # lines are recorded with their current size as a ceiling they may not
      # exceed, so the check is green today and tightens on its own every time
      # someone splits a file. Comments and blank lines do not count, so a
      # documented file is not penalised for its docs. Go tests are exempt, for
      # the reason already recorded in .golangci.yml for funlen.
      - id: file-length
        cwd: .
        run: npm run check:file-length
      # Prose lint: Markdown docs plus the comments in source files (Vale; rules
      # and vocabulary in .vale.ini + .vale/styles).
      - id: prose-lint
        cwd: .
        run: npm run lint:prose
      # Vale cannot read string literals or .mjs, so the em dash ban is also
      # enforced over every tracked file.
      - id: no-emdash
        cwd: .
        run: npm run check:no-emdash
      # Relative links and their anchors; Vale cannot resolve links.
      - id: docs-links
        cwd: .
        run: npm run check:docs-links
      # The generated graph doc must carry the graph the catalog produces. A
      # metadata change that leaves it alone leaves the doc describing a graph
      # that no longer exists, so the block is compared against what the
      # catalog produces right now. `bloud depgraph --write` refreshes it, and
      # the merge-to-main job commits the refresh (and re-renders the README
      # image from the same snapshot).
      - id: depgraph-check
        cwd: .
        run: ./bloud depgraph --check
      # The README's catalog list and one-login table are generated the same
      # way, from the same metadata. A new app that leaves them alone leaves the
      # README listing apps that do not exist and hiding apps that do, so both
      # blocks are compared against what the catalog produces right now.
      - id: catalogdoc-check
        cwd: .
        run: ./bloud catalogdoc --check

  integration:
    # Commands run inside the guest against the validation runtime deployed
    # by the tier (see cli/validate.go, runIntegrationTier). cwd is a guest
    # absolute path; BLOUD_DATA_DIR, BLOUD_TRAEFIK_DYNAMIC_DIR, and
    # BLOUD_E2E_HOST_AGENT_UNIT are injected by the tier.
    commands:
      - id: e2e-host-agent
        cwd: /var/tmp/bloud-validate-runtime/bin
        run: ./bloud-integration.test -test.v -test.timeout 30m

inference:
  paths:
    - pattern: "services/host-agent/web/**"
      triggers: [web-unit, web-check-host-agent, web-lint, web-build]
    - pattern: "services/host-agent/**"
      triggers: [go-host-agent, go-host-agent-race, go-lint, gofmt]
    - pattern: "apps/**"
      triggers: [go-apps, go-lint, gofmt]
      riskAreas: [app-install, embed]
    - pattern: "cli/**"
      triggers: [go-cli, go-lint, gofmt]
    - pattern: "e2e/**"
      triggers: []
      riskAreas: [playwright]
    - pattern: "**"
      # These ride the catch-all: any change can invalidate a doc, and the
      # matcher has no recursive `**/*.md` form (see pathMatches in cli).
      triggers: [license-headers, prose-lint, no-emdash, docs-links, image-pins, depgraph-check, catalogdoc-check]

apps:
  affine:
    auth: native-oidc
    validation-level: embed
    files:
      - apps/affine/**
    e2e-project: affine

  # The third-party MCP wrapper for affine. It has no user login of its own
  # (`none`: a harness authenticates to its MCP endpoint with a bearer Bloud
  # generates), so there is no browser journey to gate. It is covered by the
  # conformance harness, its configurator tests, and the shipped-catalog
  # contract-declaration test that pins the appApi chain.
  affine-mcp:
    auth: none
    validation-level: embed
    files:
      - apps/affine-mcp/**

  immich:
    auth: native-oidc
    validation-level: embed
    files:
      - apps/immich/**
    e2e-project: immich

  jellyfin:
    auth: ldap
    validation-level: full
    files:
      - apps/jellyfin/**
    e2e-project: jellyfin

  # Radicale authenticates over LDAP for the same reason jellyfin does: CalDAV
  # and CardDAV clients cannot follow a browser SSO redirect, so the app has
  # to verify the password the client sends. The regression gate is the DAV
  # round trip itself, not a page.
  radicale:
    auth: ldap
    validation-level: full
    files:
      - apps/radicale/**
    e2e-project: radicale

  # Calino is the client half of the same story: a browser CalDAV app that
  # declares `caldav` as a required integration, so installing it brings
  # Radicale along. It has no login of its own, so the gate is forward-auth on
  # the whole origin; the browser talks to the DAV server under the user's own
  # credential, which is Radicale's `ldap` strategy, not this app's.
  calino:
    auth: forward-auth
    validation-level: full
    files:
      - apps/calino/**
    e2e-project: calino

  navidrome:
    auth: forward-auth
    validation-level: full
    files:
      - apps/navidrome/**
    e2e-project: navidrome

  homeassistant:
    auth: native-oidc
    validation-level: embed
    files:
      - apps/homeassistant/**
    e2e-project: homeassistant

  hermes:
    auth: native-oidc
    validation-level: full
    files:
      - apps/hermes/**
    e2e-project: hermes

  # Hermes Web UI is the browser front end for the same agent apps/hermes
  # runs. Its own login is one shared password, and its native OIDC client
  # refuses any issuer that resolves to a private or loopback address, so
  # Bloud's forward-auth outpost is the door and the app validates like the
  # other apps gated at the ingress.
  hermes-webui:
    auth: forward-auth
    validation-level: full
    files:
      - apps/hermes-webui/**
    e2e-project: hermes-webui

  paperless-ngx:
    auth: native-oidc
    validation-level: embed
    files:
      - apps/paperless-ngx/**
    e2e-project: paperless-ngx

  vaultwarden:
    auth: native-oidc
    validation-level: embed
    files:
      - apps/vaultwarden/**
    e2e-project: vaultwarden

  # The Servarr trio plus qBittorrent delegate authentication to Authentik
  # forward-auth (their web UIs have no SSO of their own), so they validate
  # like navidrome: the browser journey is the regression gate.
  sonarr:
    auth: forward-auth
    validation-level: full
    files:
      - apps/sonarr/**
    e2e-project: sonarr

  radarr:
    auth: forward-auth
    validation-level: full
    files:
      - apps/radarr/**
    e2e-project: radarr

  prowlarr:
    auth: forward-auth
    validation-level: full
    files:
      - apps/prowlarr/**
    e2e-project: prowlarr

  qbittorrent:
    auth: forward-auth
    validation-level: full
    files:
      - apps/qbittorrent/**
    e2e-project: qbittorrent

  # Seerr manages its own users (Jellyfin login), so it has no Bloud SSO
  # strategy; the spec asserts its onboarding was wired by the configurator.
  seerr:
    auth: none
    validation-level: full
    files:
      - apps/seerr/**
    e2e-project: seerr
