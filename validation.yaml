tiers:
  fast:
    commands:
      # `heavy: true` marks a command that parallelises internally across every
      # core (go test, golangci-lint) and must not run alongside another heavy
      # command. The fast tier runs heavy commands one at a time and runs the
      # light commands concurrently with them; see runCommands in cli/validate.go.
      - id: go-host-agent
        cwd: services/host-agent
        run: go test ./...
        heavy: true
      - id: go-host-agent-race
        cwd: services/host-agent
        run: go test -race ./internal/engine/orchestrator/... ./internal/catalog/...
        heavy: true
      - id: go-apps
        cwd: apps
        run: go test ./...
        heavy: true
      - id: go-cli
        cwd: cli
        run: go test ./...
        heavy: true
      - id: go-lint-host-agent
        cwd: .
        run: npm run lint:go:host-agent
        heavy: true
      - id: go-lint-apps
        cwd: .
        run: npm run lint:go:apps
        heavy: true
      - id: go-lint-cli
        cwd: .
        run: npm run lint:go:cli
        heavy: true
      # gofmt owns Go layout, and nothing enforced it before, so the tree had
      # drifted (20 files when this command landed).
      - id: gofmt
        cwd: .
        run: npm run check:gofmt
      - id: web-unit
        cwd: .
        run: npm run test --workspace=@bloud/host-agent-web
      - id: web-check-host-agent
        cwd: .
        run: npm run check --workspace=@bloud/host-agent-web
      - id: web-lint
        cwd: .
        run: npm run lint:web
      # The static bundle is the artifact host-agent actually serves
      # (invariant 11), so a broken production build is a real failure --
      # typecheck alone does not catch adapter/build-time errors.
      - id: web-build
        cwd: .
        run: npm run build --workspace=@bloud/host-agent-web
      - id: license-headers
        cwd: .
        run: npm run license:check
      # Every container image Bloud runs has to name a specific version. A
      # rolling tag (`:latest`, `:release`, `:stable`) is republished upstream,
      # so an install is not reproducible and a bump is not reviewable. The
      # check reads the catalog and the Go image constants, and prints its
      # declared exceptions on every run.
      - id: image-pins
        cwd: .
        run: npm run check:image-pins
      # File length is a ratchet, not a cap. The files already over 500 code
      # lines are recorded with their current size as a ceiling they may not
      # exceed, so the check is green today and tightens on its own every time
      # someone splits a file. Comments and blank lines do not count, so a
      # documented file is not penalised for its docs. Go tests are exempt, for
      # the reason already recorded in .golangci.yml for funlen.
      - id: file-length
        cwd: .
        run: npm run check:file-length
      # A component that starts a timer is a component deciding when data
      # changes, which is store work (see docs/plans/frontend-fsm.md). The check
      # also validates its own exception table, so it runs whole-tree.
      - id: no-component-timers
        cwd: .
        run: npm run check:no-component-timers
      # The runes binding is the store's only component binding. One
      # `svelte/store` import would make the architecture optional, so the
      # exception table is empty and this check is absolute.
      - id: no-legacy-store
        cwd: .
        run: npm run check:no-legacy-store
      # Prose lint: Markdown docs plus the comments in source files (Vale; rules
      # and vocabulary in .vale.ini + .vale/styles).
      - id: prose-lint
        cwd: .
        run: npm run lint:prose
      # Vale cannot read string literals or .mjs, so the em dash ban is also
      # enforced over every tracked file.
      - id: no-emdash
        cwd: .
        run: npm run check:no-emdash
      # Relative links and their anchors; Vale cannot resolve links.
      - id: docs-links
        cwd: .
        run: npm run check:docs-links
      # The README's generated diagram must carry the graph the catalog
      # produces. A metadata change that leaves it alone leaves the README
      # depicting a graph that no longer exists, so the block is compared
      # against what the catalog produces right now. `bloud depgraph --write`
      # refreshes it, and the merge-to-main job commits the refresh.
      - id: depgraph-check
        cwd: .
        run: ./bloud depgraph --check
      # The README's catalog list and one-login table are generated the same
      # way, from the same metadata. A new app that leaves them alone leaves the
      # README listing apps that do not exist and hiding apps that do, so both
      # blocks are compared against what the catalog produces right now.
      - id: catalogdoc-check
        cwd: .
        run: ./bloud catalogdoc --check
      # The debug-port list is generated the same way, from the same metadata,
      # into the two VM specs and the AGENTS.md table. Every one of those was a
      # hand-written copy before this, and two had already lost ports the catalog
      # declares, so the QEMU guest booted without them and nothing said so.
      - id: ports-check
        cwd: .
        run: ./bloud ports --check

  integration:
    # Commands run inside the guest against the validation runtime deployed
    # by the tier (see cli/validate.go, runIntegrationTier). cwd is a guest
    # absolute path; BLOUD_DATA_DIR, BLOUD_APPS_DIR, BLOUD_TRAEFIK_DYNAMIC_DIR,
    # and BLOUD_E2E_HOST_AGENT_UNIT are injected by the tier.
    commands:
      - id: e2e-host-agent
        cwd: /var/tmp/bloud-validate-runtime/bin
        run: ./bloud-integration.test -test.v -test.timeout 30m

inference:
  paths:
    # Module globs are ordered most-specific first: the first one to match a
    # file claims it (see inferTriggers in cli/inference.go), so a web file
    # triggers the web checks and not the host-agent Go suite.
    - pattern: "services/host-agent/web/**"
      triggers: [web-unit, web-check-host-agent, web-lint, web-build]
    - pattern: "services/host-agent/**"
      triggers: [go-host-agent, go-host-agent-race, go-lint-host-agent, gofmt]
    - pattern: "apps/**"
      triggers: [go-apps, go-lint-apps, gofmt]
      riskAreas: [app-install, embed]
    - pattern: "cli/**"
      triggers: [go-cli, go-lint-cli, gofmt]
    - pattern: "e2e/**"
      triggers: []
      riskAreas: [playwright]
    # The browser harness is shared with the e2e suite, so a harness change is a
    # Playwright risk too. It has no fast-tier command of its own; the e2e
    # matrix runs every app when a file outside the app directories changes.
    - pattern: "harness/**"
      triggers: []
      riskAreas: [playwright]
    # Root-level config and script files can break any check, so they trigger
    # the whole tier. A `*` trigger means "every command" (see triggeredCommands
    # in cli/validate.go).
    - pattern: "package.json"
      triggers: ["*"]
    - pattern: "package-lock.json"
      triggers: ["*"]
    - pattern: "validation.yaml"
      triggers: ["*"]
    - pattern: "scripts/**"
      triggers: ["*"]
    # The lint config governs all three modules' lint runs.
    - pattern: ".golangci.yml"
      triggers: [go-lint-host-agent, go-lint-apps, go-lint-cli]
    - pattern: "**"
      # These ride the catch-all: any change can invalidate a doc, a link, an
      # image pin, or a file-length ceiling, and the matcher has no recursive
      # `**/*.md` form (see pathMatches in cli).
      triggers: [license-headers, prose-lint, no-emdash, docs-links, image-pins, file-length, no-component-timers, no-legacy-store, depgraph-check, catalogdoc-check, ports-check]
