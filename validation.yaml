tiers:
  fast:
    commands:
      - id: go-host-agent
        cwd: services/host-agent
        run: go test ./...
      - id: go-host-agent-race
        cwd: services/host-agent
        run: go test -race ./internal/orchestrator/...
      - id: go-apps
        cwd: apps
        run: go test ./...
      - id: go-cli
        cwd: cli
        run: go test ./...
      - id: web-unit
        cwd: .
        run: npm run test --workspace=@bloud/host-agent-web
      - id: web-check-host-agent
        cwd: .
        run: npm run check --workspace=@bloud/host-agent-web
      - id: license-headers
        cwd: .
        run: npm run license:check

  integration:
    # Commands run inside the guest against the validation runtime deployed
    # by the tier (see cli/validate.go, runIntegrationTier). cwd is a guest
    # absolute path; BLOUD_DATA_DIR, BLOUD_TRAEFIK_DYNAMIC_DIR, and
    # BLOUD_E2E_HOST_AGENT_UNIT are injected by the tier.
    commands:
      - id: e2e-host-agent
        cwd: /var/tmp/bloud-validate-runtime/bin
        run: ./bloud-integration.test -test.v -test.timeout 30m

inference:
  paths:
    - pattern: "services/host-agent/web/**"
      triggers: [web-unit, web-check-host-agent]
    - pattern: "services/host-agent/**"
      triggers: [go-host-agent, go-host-agent-race]
    - pattern: "apps/**"
      triggers: [go-apps]
      riskAreas: [app-install, embed]
    - pattern: "cli/**"
      triggers: [go-cli]
    - pattern: "e2e/**"
      triggers: []
      riskAreas: [playwright]
    - pattern: "**"
      triggers: [license-headers]

apps:
  immich:
    auth: native-oidc
    validation-level: embed
    files:
      - apps/immich/**
    e2e-project: immich

  jellyfin:
    auth: ldap
    validation-level: full
    files:
      - apps/jellyfin/**
    e2e-project: jellyfin

  navidrome:
    auth: forward-auth
    validation-level: full
    files:
      - apps/navidrome/**
    e2e-project: navidrome
