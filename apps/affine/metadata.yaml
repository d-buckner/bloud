# SPDX-License-Identifier: AGPL-3.0-only
name: affine
displayName: AFFiNE
description: AI-native knowledge base that unifies docs, databases, and whiteboards
category: productivity
port: 3010
estimatedSizeMB: 400

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  sso:
    required: false
    multi: false
    # The shared workspace has to know who the Bloud users are, and the identity
    # provider is the only place that answer lives. Declaring the contract alone
    # gets the provider's address; `apiToken` is what lets the configurator
    # read its user list (invariant 15).
    requires:
      - apiToken
    compatible:
      - app: authentik
        default: true
  # AFFiNE's built-in AI (copilot) reaches an OpenAI-compatible endpoint
  # through a per-workspace BYOK profile. Bloud is the endpoint, not the
  # operator's real provider key: the configurator writes the custom-endpoint
  # policy into config.json and registers the resolved binding as a workspace
  # profile through AFFiNE's own API, so "bring your own endpoint" needs no
  # manual workspace setting. `requires: [apiKey]` because the gateway
  # authenticates with it; declaring the contract gets the address, the
  # explicit requirement gets the credential (invariant 15).
  inference:
    required: false
    multi: false
    requires:
      - apiKey
    compatible:
      - source: instance

# AFFiNE ships its own MCP server: a stateless streamable-HTTP endpoint per
# workspace, authenticated by a scoped `aff_mcp_v1.*` bearer the app mints
# through its own API. Bloud does not wrap it in another container. It mints
# one credential as the owner it bootstraps and publishes it, so a harness that
# declares the `mcp` contract gets a real AFFiNE credential it can revoke in
# the AFFiNE UI, and the endpoint path travels as a runtime value because the
# workspace id is created by AFFiNE, not knowable in this file.
#
# Requires copilot.enabled, which the configurator writes into config.json.
provides:
  mcp:
    secrets: [httpToken]
    values:
      serverName: affine
    runtimeValues: [path]

# SSO via the host-agent's per-app Authentik OIDC provider. AFFiNE's generic
# OIDC provider (oauth.providers.oidc) performs discovery against the issuer
# and uses PKCE + client secret; the browser callback lands on
# /oauth/callback on the app's public subdomain (see the configurator, which
# writes server.externalUrl so the redirect_uri matches the registered one).
sso:
  strategy: native-oidc
  callbackPath: /oauth/callback
  userCreation: true

containers:
  - name: apps-affine-postgres
    image: docker.io/pgvector/pgvector:pg16
    network: affine-internal
    restartPolicy: always
    environment:
      POSTGRES_USER: affine
      POSTGRES_DB: affine
      POSTGRES_PASSWORD: "{{postgresPassword}}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - source: "{{appDataDir}}/postgres"
        destination: /var/lib/postgresql/data
    healthCheck:
      test: ["CMD-SHELL", "pg_isready -U affine -d affine"]
      interval: 5
      timeout: 5
      retries: 10

  - name: apps-affine-redis
    image: docker.io/redis:7-alpine
    network: affine-internal
    restartPolicy: always
    healthCheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5
      timeout: 5
      retries: 5

  # AFFiNE's document search has two channels, and `doc_search` reports
  # SEARCH_UNAVAILABLE when both are down. The lexical channel needs an
  # external indexer service (provider enum is exactly manticoresearch or
  # elasticsearch); the vector channel needs an embedding model, which on
  # self-hosted means an operator-supplied AI provider key. Bundling Manticore
  # lights the lexical channel with no AI key, which is what makes the MCP
  # `doc_search` tool answer at all. Invariant 3: the app owns its own search
  # infrastructure, the same way it owns its own postgres and redis.
  - name: apps-affine-search
    image: docker.io/manticoresearch/manticore:29.9.0
    network: affine-internal
    restartPolicy: always
    volumes:
      - source: "{{appDataDir}}/search"
        destination: /var/lib/manticore
    healthCheck:
      # The image ships wget but no curl; 9308 is the HTTP interface AFFiNE
      # dials. The root path answers with an Elasticsearch-compatibility banner
      # (Manticore fakes an ES 7.4.1 hello), so a 200 here means Manticore,
      # not Elasticsearch.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9308/ || exit 1"]
      interval: 5
      timeout: 5
      retries: 20

  # The official self-host deployment runs a one-shot migration job
  # (prisma migrate deploy + data migrations + private.key generation) before
  # the server starts. Bloud's orchestrator manages long-lived containers, so
  # the migration step is chained into the server's startup command instead:
  # it is idempotent and keeps the ordering guarantee (migrations complete
  # before the server accepts traffic) in a single node.
  - name: apps-affine
    image: ghcr.io/toeverything/affine:0.27.4
    networks:
      - affine-internal
      - apps-net
    restartPolicy: always
    command:
      - sh
      - -c
      - node ./scripts/self-host-predeploy.js && exec node ./dist/main.js
    ports:
      - host: 3010
        container: 3010
    environment:
      DATABASE_URL: "postgresql://affine:{{postgresPassword}}@apps-affine-postgres:5432/affine"
      REDIS_SERVER_HOST: apps-affine-redis
      # Keyword search backend. Without this the MCP `doc_search` tool answers
      # SEARCH_UNAVAILABLE because the lexical channel is null and the vector
      # channel needs an embedding model Bloud does not supply.
      AFFINE_INDEXER_ENABLED: "true"
      AFFINE_INDEXER_SEARCH_PROVIDER: manticoresearch
      AFFINE_INDEXER_SEARCH_ENDPOINT: "http://apps-affine-search:9308"
      # The copilot/BYOK policy is enforced by AFFiNE's native (Rust) runtime,
      # and that runtime does NOT read ~/.affine/config/config.json on its own:
      # its default config paths are the node executable's directory and the
      # CWD, neither of which holds our file. Without this pointer the runtime
      # sees copilot disabled, every AI request answers `copilot_disabled`, and
      # the BYOK GraphQL query is refused, so Bloud cannot register the
      # inference endpoint at all. Upstream fixed this after 0.27.4 (config.json
      # gains `deployment.type` and the image runs an upgrade-config step); the
      # env var is the workaround on the pinned image. See affine/AFFiNE#15506.
      AFFINE_BACKEND_RUNTIME_CONFIG_PATH: /root/.affine/config/config.json
      # `deployment_from_env()` in the native runtime accepts only this value;
      # anything else (including unset) is Deployment::Cloud, which reports
      # `customEndpointMode: unavailable` and refuses every OpenAI-compatible
      # endpoint in the BYOK dialog. The JS side reads the same variable:
      # `selfhosted` is what makes the frontend serve the /sign-in page (with
      # its Continue with OIDC button) instead of the cloud read-only editor.
      DEPLOYMENT_TYPE: selfhosted
    # sso.localhost resolves to the host gateway inside the VM, letting the
    # server reach the OIDC provider (traefik) by the same name browsers use.
    extraHosts:
      - sso.localhost:host-gateway
    volumes:
      - source: "{{appDataDir}}/storage"
        destination: /root/.affine/storage
      - source: "{{appDataDir}}/config"
        destination: /root/.affine/config
    healthCheck:
      # The slim node image has no curl/wget; node itself provides fetch.
      test:
        - CMD-SHELL
        - "node -e 'fetch(\"http://127.0.0.1:3010/info\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"
      interval: 5
      timeout: 10
      retries: 90
    dependsOn:
      - apps-affine-postgres
      - apps-affine-redis
      - apps-affine-search
