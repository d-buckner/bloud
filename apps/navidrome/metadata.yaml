name: navidrome
displayName: Navidrome
description: Modern music server and streamer compatible with Subsonic/Airsonic clients
category: media
port: 4533

integrations: {}

# SSO via Authentik forward auth; Subsonic API clients use their own token auth.
# /rest/ bypasses forward-auth so Subsonic clients can authenticate directly
# against Navidrome using the Subsonic credential scheme (accepted trade-off —
# the Subsonic protocol has no mechanism for delegating auth to a third party).
sso:
  strategy: forward-auth
  bypassPaths:
    - /rest/

healthCheck:
  path: /ping
  interval: 5
  timeout: 60

container:
  name: apps-navidrome
  image: docker.io/deluan/navidrome:latest
  network: apps-net
  restartPolicy: always
  environment:
    ND_MUSICFOLDER: /music
    ND_DATAFOLDER: /data
    ND_PORT: "4533"
    ND_LOGLEVEL: info
    ND_ENABLETRANSCODINGCONFIG: "false"
    ND_EXTAUTH_USERHEADER: X-authentik-username
    ND_EXTAUTH_TRUSTEDSOURCES: 0.0.0.0/0
  ports:
    - host: 4533
      container: 4533
  volumes:
    - source: "{{appDataDir}}/data"
      destination: /data
    - source: "{{dataDir}}/media/music"
      destination: /music
      options: [ro]
