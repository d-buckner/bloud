name: navidrome
displayName: Navidrome
description: Modern music server and streamer compatible with Subsonic/Airsonic clients
category: media
port: 4533

integrations: {}

# SSO via Authentik forward auth; Subsonic API clients use their own token auth
sso:
  strategy: forward-auth

healthCheck:
  path: /ping
  interval: 5
  timeout: 60

container:
  name: apps-navidrome
  image: docker.io/deluan/navidrome:latest
  network: apps-net
  restartPolicy: always
  environment:
    ND_MUSICFOLDER: /music
    ND_DATAFOLDER: /data
    ND_PORT: "4533"
    ND_LOGLEVEL: info
    ND_ENABLETRANSCODINGCONFIG: "false"
    ND_REVERSEPROXYUSERHEADER: X-authentik-username
    ND_REVERSEPROXYWHITELIST: 0.0.0.0/0
  ports:
    - host: 4533
      container: 4533
  volumes:
    - source: "{{appDataDir}}/data"
      destination: /data
    - source: "{{dataDir}}/media/music"
      destination: /music
      options: [ro]
