# SPDX-License-Identifier: AGPL-3.0-only
name: immich-mcp
displayName: Immich MCP
description: MCP tool server for Immich, so an agent can search, upload, and organise a photo library
category: media
port: 9223
estimatedSizeMB: 260

# No browser UI: the app serves an MCP endpoint and a liveness probe, and
# nothing a person can open. The dashboard therefore draws no tile for it,
# since a tile is an invitation to a page that does not exist. Everything else
# is ordinary: it stays in the catalog, in GET /api/apps/installed, and in the
# developer graph, and Bloud installs, reconciles, and routes it like any other
# app.
headless: true

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  # The wrapper is not a browser and cannot join the identity provider, so it
  # needs a credential into Immich's own API. Immich mints a scoped API key and
  # publishes it under `appToken`; `requires: [token]` is the whole consumer
  # surface. The graph edge this required integration produces is what orders
  # Immich first, so the key is published before this app's PreStart reads it.
  appToken:
    required: true
    multi: false
    requires:
      - token
    compatible:
      - app: immich
        default: true

# The same `mcp` contract affine-mcp provides, under its own namespace so a
# harness can register both and choose per call. Both values are static: the
# Caddy edge in front of the upstream serves one endpoint for the whole app.
provides:
  mcp:
    secrets: [httpToken]
    values:
      serverName: immich-mcp
      path: /mcp

# Two containers: the upstream tool server, which has no inbound
# authentication of its own, and a Caddy edge in front of it that requires the
# bearer Bloud publishes. The edge owns the app's published port, so the `mcp`
# contract's token is a credential a container this app runs actually
# validates; see INTEGRATION.md.
containers:
  - name: apps-immich-mcp-upstream
    image: ghcr.io/barryw/immichmcp:v3.3.3
    network: apps-net
    restartPolicy: always
    environment:
      # The image reads IMMICH_BASE_URL / IMMICH_API_KEY from the environment
      # first and falls back to `Immich:BaseUrl` / `Immich:ApiKey` from
      # appsettings.json, which the configurator writes into the app's data
      # directory and mounts below. The credential cannot live in the
      # environment: it is minted at runtime, and a container spec renders only
      # static metadata, so the generated file is the delivery channel.
      MCP_PORT: "5000"
      MCP_LOG_LEVEL: Information
      DOWNLOAD_MODE: url
      # static exposes all tools up front. gateway exposes only
      # `immich_tools_list` and `immich_tools_enable` and relies on the client
      # acting on `notifications/tools/list_changed`; Hermes registers a
      # namespace at startup and does not enable categories, so gateway mode
      # would hand it two meta-tools instead of the library tools.
      IMMICH_TOOL_MODE: static
    volumes:
      - source: "{{appDataDir}}/config/appsettings.json"
        destination: /app/appsettings.json
    healthCheck:
      # /health/ready pings Immich, so the orchestrator's health phase proves
      # the upstream can reach the library, not merely that Kestrel answered.
      # /health alone is liveness only and would pass on a wrapper that cannot
      # authenticate at all.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5000/health/ready || exit 1"]
      interval: 5
      timeout: 10
      retries: 60
    # The edge converges first because its PreStart writes this container's
    # appsettings.json. The container binds its Immich options lazily, so a
    # start against a missing file is not fatal, but its readiness probe would
    # fail on every attempt; ordering the write first is what makes the first
    # install converge in one pass. The proxy holding a request until the
    # upstream is up is the normal case, so the backward edge costs nothing.
    dependsOn:
      - apps-immich-mcp

  - name: apps-immich-mcp
    image: docker.io/library/caddy:2.11.6-alpine
    network: apps-net
    restartPolicy: always
    ports:
      - host: 9223
        container: 9223
    volumes:
      - source: "{{appDataDir}}/config/Caddyfile"
        destination: /etc/caddy/Caddyfile
    healthCheck:
      # /health is answered by Caddy itself rather than proxied to the
      # upstream: the edge must become healthy before the upstream (which
      # depends on it) starts, so a proxied probe would deadlock the first
      # install.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9223/health || exit 1"]
      interval: 5
      timeout: 5
      retries: 10
