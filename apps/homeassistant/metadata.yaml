name: homeassistant
displayName: Home Assistant
description: Open-source home automation platform
category: infrastructure
port: 8123

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  sso:
    required: false
    multi: false
    compatible:
      - app: authentik
        default: true

# Home Assistant OS container via Docker; the Docker image includes the OS.
# SSO via Authentik native-oidc.
sso:
  strategy: native-oidc
  callbackPath: /auth/callback
  userCreation: true

containers:
  - name: apps-homeassistant
    image: docker.io/homeassistant/home-assistant:latest
    network: apps-net
    restartPolicy: always
    environment:
      HASSIO_TOKEN: "{{appDataDir}}/token"
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    ports:
      - host: 8123
        container: 8123
    volumes:
      - source: "{{appDataDir}}/config"
        destination: /config
      - source: "{{appDataDir}}/addons"
        destination: /addons
    healthCheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8123/api/health"]
      interval: 5
      timeout: 10
      retries: 60