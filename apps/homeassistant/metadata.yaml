# SPDX-License-Identifier: AGPL-3.0-only
name: homeassistant
displayName: Home Assistant
description: Open-source home automation platform
category: productivity
port: 8123

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  sso:
    required: false
    multi: false
    compatible:
      - app: authentik
        default: true

# SSO via the community hass-oidc-auth auth provider (fetched at PreStart by
# the configurator). Callback route is the provider's fixed
# /auth/oidc/callback; see INTEGRATION.md.
sso:
  strategy: native-oidc
  callbackPath: /auth/oidc/callback
  userCreation: true

# The machine credential: a long-lived access token Bloud mints for the
# break-glass owner and publishes under the `appApi` contract, so a companion
# that is not a browser (apps/ha-mcp) can authenticate without ever holding the
# owner password. The username is a value because Home Assistant's own UI shows
# it; the token is the secret, and it is revocable, which the password is not.
# See INTEGRATION.md "Companion token".
provides:
  appApi:
    secrets: [password]
    # The contract names its credential `password` because that is the field the
    # consumer's binding carries, and for AFFiNE that is literally true. Home
    # Assistant's is a token minted on a profile page, so the offer renames the
    # box: a field labeled "Password" invites the operator to type the one string
    # that will be refused on every call.
    secretLabels:
      password: Long-lived access token
    secretHelp:
      password: >-
        Mint it in Home Assistant itself: open your profile (bottom of the
        sidebar), then Long-lived access tokens, then Create. It is not your
        account password.
    # The username names the local break-glass account, and it stays a static
    # value rather than an operator input: a remote token belongs to whichever
    # account minted it, and nothing in the catalog reads this field for Home
    # Assistant, so asking for an account name would be asking for decoration.
    # The contract requires the key, so it is declared; the form leaves it out,
    # because a value the catalog can answer is not a question.
    values:
      username: bloud-bootstrap-admin

containers:
  - name: apps-homeassistant
    image: docker.io/homeassistant/home-assistant:2026.9.0
    network: apps-net
    # always: homeassistant.restart (used by the configurator after config
    # changes) exits the process; the restart policy brings the container back.
    restartPolicy: always
    environment:
      TZ: Etc/UTC
    ports:
      - host: 8123
        container: 8123
    volumes:
      - source: "{{appDataDir}}/config"
        destination: /config
    # The HA image has no curl; poll with its own python3 (HA is Python-based).
    # A raw HTTP GET on '/' verifies the listener answers with an HTTP
    # response (redirect to login/onboarding is fine). /api/ requires auth.
    healthCheck:
      test:
        - CMD-SHELL
        - 'python3 -c "import socket,sys; s=socket.create_connection((\"localhost\",8123),5); s.sendall(b\"GET / HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r\n\"); ok=s.recv(16).startswith(b\"HTTP/1\"); s.close(); sys.exit(0 if ok else 1)"'
      interval: 5
      timeout: 10
      retries: 60
