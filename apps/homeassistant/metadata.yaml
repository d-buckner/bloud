name: homeassistant
displayName: Home Assistant
description: Open-source home automation platform
category: productivity
port: 8123

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  sso:
    required: false
    multi: false
    compatible:
      - app: authentik
        default: true

# SSO via the community hass-oidc-auth auth provider (fetched at PreStart by
# the configurator). Callback route is the provider's fixed
# /auth/oidc/callback — see INTEGRATION.md.
sso:
  strategy: native-oidc
  callbackPath: /auth/oidc/callback
  userCreation: true

containers:
  - name: apps-homeassistant
    image: docker.io/homeassistant/home-assistant:2026.9.0
    network: apps-net
    # always: homeassistant.restart (used by the configurator after config
    # changes) exits the process; the restart policy brings the container back.
    restartPolicy: always
    environment:
      TZ: Etc/UTC
    ports:
      - host: 8123
        container: 8123
    volumes:
      - source: "{{appDataDir}}/config"
        destination: /config
    # The HA image has no curl; use its own python. /api/ answers without
    # auth ("API running") once the HTTP listener is up.
    healthCheck:
      test:
        - CMD-SHELL
        - python3 -c 'import urllib.request,sys;urllib.request.urlopen("http://localhost:8123/api/",timeout=5)'
      interval: 5
      timeout: 10
      retries: 60
