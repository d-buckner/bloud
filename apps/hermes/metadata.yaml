# SPDX-License-Identifier: AGPL-3.0-only
name: hermes
displayName: Hermes
description: Self-improving AI agent with persistent memory, scheduled automations, and a web dashboard
category: productivity
port: 9119
estimatedSizeMB: 5000

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  sso:
    required: false
    multi: false
    compatible:
      - app: authentik
        default: true
  # Hermes is an inference consumer, and the provider is the instance itself.
  # `source: setting` is not an app: the resolver reads Bloud's own AI
  # settings (Settings -> AI), so there is nothing to install or uninstall and
  # no container to order on the graph. The graph still shows the wiring, as an
  # edge to the AI Model node.
  inference:
    required: false
    multi: false
    requires:
      - apiKey
    compatible:
      - source: setting
        default: true
  # MCP servers Bloud wires into the agent. `multi: true` because the whole
  # point is that a harness takes as many tool namespaces as the instance
  # provides, and which ones exist changes as apps are installed. Optional
  # because Hermes is a working agent with no MCP servers at all.
  #
  # `requires: [httpToken]` is the whole consumer surface: the provider's
  # scoped bearer and nothing else. Each entry lands in Hermes' own
  # `mcp_servers` map under the provider's serverName, so installing an
  # MCP-capable app gives the agent a new namespace without any Hermes change.
  mcp:
    required: false
    multi: true
    requires:
      - httpToken
    compatible:
      # The wrapper is the only AFFiNE MCP provider. AFFiNE's own server is not
      # exposed: it is read-only and workspace-scoped, and `apps/affine-mcp`
      # offers a far wider read-write surface over the same workspace. Listing
      # it here is what lets Hermes register the namespace; `mcp` is optional
      # and multi, so neither app is required.
      - app: affine-mcp
      # The request and arr stack. Seerr holds the requests and `apps/arr-mcp`
      # exposes them together with whichever Servarrs are installed, so "what
      # was requested and what is stuck" reaches the apps the household already
      # uses. Same shape as the wrappers around it: Hermes changes nothing when
      # another MCP app appears.
      - app: arr-mcp
      # The calendar. Radicale holds the family calendar and the synced
      # Radarr/Sonarr feeds, and `apps/dav-mcp` exposes them as a tool
      # namespace, which is what turns "what's on the shared calendar this
      # week?" into something the agent can actually answer. Declared rather
      # than hardwired: install the MCP app and the agent gains the namespace,
      # uninstall it and the entry is removed on the next pass.
      - app: dav-mcp
      # The media library. Jellyfin holds the collection and `apps/jellyfin-mcp`
      # exposes it as a tool namespace, so "what can I watch tonight?" and
      # "add this to the watchlist" reach the library the household already
      # uses instead of being a question the agent cannot answer. Same shape as
      # the two above: Hermes changes nothing when another MCP app appears.
      - app: jellyfin-mcp

# SSO joins Authentik through the Hermes dashboard's bundled self-hosted
# OIDC provider (public authorization-code + PKCE client). That provider
# accepts an https issuer anywhere, but a plain http issuer only on a literal
# loopback hostname (localhost / 127.0.0.1 / ::1): Bloud's shared issuer host
# (sso.localhost) is rejected, and the dashboard then fails closed at startup
# with no provider registered. Hermes therefore takes the loopback issuer
# (loopbackIssuer: http://localhost:8080, reached because the container shares
# the host network namespace). The provider's issuer and client_id and the
# dashboard public URL are per-install values written into Hermes' config.yaml
# by the configurator (the container spec cannot render them), so none are
# declared here.
sso:
  strategy: native-oidc
  clientType: public
  loopbackIssuer: true
  callbackPath: /auth/callback
  providerName: Bloud SSO
  userCreation: true
  # offline_access is what makes Authentik issue a refresh token, so the
  # dashboard session can be rotated instead of re-authenticated. The
  # matching request side is managedScopes in configurator.go; the two are
  # pinned together by a test, and the failure mode without this line is
  # documented in INTEGRATION.md.
  scopes:
    - offline_access
  # 90 days (129600 minutes). The dashboard session lifetime tracks the
  # access token's exp, so this is how long a sign-in lasts before anything
  # has to be rotated. Bloud's native-oidc default is 5 minutes, which is
  # what made the Desktop app re-authenticate constantly.
  accessTokenMinutes: 129600

# What this app hands other apps: the agent's OpenAI-compatible API, served on
# the gateway's own port rather than on the dashboard port the UI lives on.
# `port: gateway` names the extraPorts entry below, so the number lives in one
# place; the address a consumer dials is composed from it and its pathPrefix by
# the resolver, and Traefik routes that prefix here.
#
# `apiKey` is the bearer the agent listener authenticates with. Hermes mints
# it on first boot into $HERMES_HOME/.env (the image generates one when none
# is present), and the configurator reads it back out and publishes it here,
# so the credential stays Hermes-owned and Bloud only relays it. See
# INTEGRATION.md for why Bloud does not write that file.
provides:
  agentApi:
    port: gateway
    secrets:
      - apiKey
    runtimeValues:
      # The default model Hermes is actually running, so a consumer front end
      # can preset its own model picker to the same model rather than
      # defaulting to whatever a discovered list happens to order first. It is
      # a runtime value because it comes from the Bloud inference binding, not
      # from static catalog metadata.
      - modelName

# The agent API is a second surface on the same container, on a port that is
# not the dashboard's. It is declared here rather than as a container `ports:`
# entry on purpose: a `ports:` entry would publish 8642 to the host, putting
# an agent with terminal access directly on the LAN behind one bearer token.
# An extraPort is published to Bloud's consumers instead: Traefik reaches it
# on the loopback Hermes already binds, and consumers dial it through the
# app's routed origin.
extraPorts:
  - name: gateway
    port: 8642
    pathPrefix: /v1

containers:
  - name: apps-hermes
    image: docker.io/nousresearch/hermes-agent:v2026.9.14
    # Host networking is load-bearing: the dashboard's OIDC issuer is the
    # host loopback (http://localhost:8080), and only inside the host network
    # namespace does localhost reach Traefik. Traefik routes to this app at
    # http://localhost:9119, which the loopback bind below satisfies. Host
    # networking cannot publish ports, so none are declared.
    network: host
    restartPolicy: always
    # The image is an s6-overlay stack: the web dashboard runs as a
    # supervised service when HERMES_DASHBOARD=1 (per-profile messaging
    # gateways register dynamically under it). The container's main
    # program is a parked sleep: the interactive `hermes` TUI the
    # empty CMD would start needs a TTY and would exit immediately
    # headless. Dashboard chat runs in-process; no gateway required.
    # The gateway is the container's main program. The API server is a
    # gateway platform adapter, so nothing answers on 8642 until the
    # gateway runs: the dashboard alone does not start it. `gateway run`
    # is the foreground form the image documents for containers, and the
    # entrypoint dispatch passes `command:` through as `hermes <args>`.
    #
    # This replaces the parked `sleep infinity` that ran when the dashboard
    # was the only surface Bloud needed. It also brings the messaging
    # gateways with it: any platform the operator configures now actually
    # connects, which is the point of the app rather than a side effect.
    command: ["gateway", "run"]
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PORT: "9119"
      # Loopback bind: the dashboard is reachable only through Traefik (which
      # shares the host network namespace), never directly from the network.
      # The auth gate still engages because the configurator sets
      # dashboard.public_url, and the self-hosted OIDC provider it writes into
      # config.yaml satisfies it.
      HERMES_DASHBOARD_HOST: "127.0.0.1"
      # The agent API's own port. Left at the image default of 8642 and
      # bound to loopback, which is what keeps it reachable by Traefik (in
      # the same host namespace) and unreachable by anything else. Not
      # published, so no `ports:` entry exists for it and the LAN never
      # sees it; consumers arrive through the routed /v1 prefix instead.
      API_SERVER_PORT: "8642"
      # The data-directory permission contract. Hermes secures $HERMES_HOME to
      # 0700 for a bare-metal install, and the host agent cannot undo that from
      # outside: the directory belongs to the container's uid mapped into the
      # rootless podman subuid range, so chmod against it is EPERM. Both vars
      # are upstream's own opt-outs; see INTEGRATION.md.
      #
      # Hermes' container probe reads /.dockerenv and the cgroup markers
      # "docker", "lxc", "kubepods". Podman matches none of them, so under
      # podman Hermes treats the install as bare-metal. This says otherwise.
      HERMES_CONTAINER: "1"
      # The mode Hermes re-applies to $HERMES_HOME on every start. 0777
      # because the host agent is neither owner nor group member of the
      # container's mapped subuid, so only the world-write bit lets it create
      # the temp file that managedfile.Write renames into place. Applied on
      # every boot, which is what makes it hold: a one-shot chmod from the
      # host is re-tightened by the next container start.
      HERMES_HOME_MODE: "0777"
    volumes:
      - source: "{{appDataDir}}/data"
        destination: /opt/data
    healthCheck:
      # /api/health is the upstream public liveness path, exempt from the
      # dashboard auth gate (safe for external probes by design).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9119/api/health || exit 1"]
      interval: 5
      timeout: 10
      retries: 90
