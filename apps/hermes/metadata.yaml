name: hermes
displayName: Hermes
description: Self-improving AI agent with persistent memory, scheduled automations, and a web dashboard
category: productivity
port: 9119
estimatedSizeMB: 5000

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  sso:
    required: false
    multi: false
    compatible:
      - app: authentik
        default: true

# SSO joins Authentik through the Hermes dashboard's bundled self-hosted
# OIDC provider (public authorization-code + PKCE client). Hermes enforces
# its own auth gate on the non-loopback bind Bloud reaches it through, and
# that gate is satisfied by the self-hosted provider rather than a password.
# The provider's issuer/client_id and the dashboard public URL are written
# into Hermes' config.yaml by the configurator (the container spec cannot
# carry per-install OIDC values), so none are declared here.
sso:
  strategy: native-oidc
  clientType: public
  callbackPath: /auth/callback
  providerName: Bloud SSO
  userCreation: true

containers:
  - name: apps-hermes
    image: docker.io/nousresearch/hermes-agent:v2026.9.14
    network: apps-net
    restartPolicy: always
    # The image is an s6-overlay stack: the web dashboard runs as a
    # supervised service when HERMES_DASHBOARD=1 (per-profile messaging
    # gateways register dynamically under it). The container's main
    # program is a parked sleep: the interactive `hermes` TUI the
    # empty CMD would start needs a TTY and would exit immediately
    # headless. Dashboard chat runs in-process; no gateway required.
    command: ["sleep", "infinity"]
    ports:
      - host: 9119
        container: 9119
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PORT: "9119"
      # The dashboard binds non-loopback (reached through Traefik), which
      # engages Hermes' auth gate. The gate is backed by the self-hosted
      # OIDC provider the configurator writes into config.yaml; no
      # bundled username/password is set.
    volumes:
      - source: "{{appDataDir}}/data"
        destination: /opt/data
    healthCheck:
      # /api/health is the upstream public liveness path, exempt from the
      # dashboard auth gate (safe for external probes by design).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9119/api/health || exit 1"]
      interval: 5
      timeout: 10
      retries: 90
