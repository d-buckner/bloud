# SPDX-License-Identifier: AGPL-3.0-only
name: hermes-webui
displayName: Hermes Web UI
description: Browser front end for the Hermes agent, with sessions, workspaces, and a Control Center
category: productivity
port: 8787
estimatedSizeMB: 1200

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  sso:
    required: false
    multi: false
    compatible:
      - app: authentik
        default: true
  # The agent this UI drives needs a model, and the instance is the provider.
  # `source: instance` means the resolver reads Bloud's own AI settings
  # (Settings -> AI), so there is no container to order on the graph; the
  # edge to the AI Model node is the wiring, and the configurator writes the
  # endpoint and key into the agent's config.yaml.
  inference:
    required: false
    multi: false
    requires:
      - apiKey
    compatible:
      - source: instance
        default: true

# The app's own login is a single shared password, and its native OIDC client
# will not talk to a home-LAN issuer at all: it requires https for every OIDC
# endpoint and refuses to dial any address that resolves to a private,
# loopback, or link-local IP (api/auth_oidc.py:_validate_outbound_oidc_url),
# which is what `sso.localhost` and a LAN-issued certificate both are. So the
# gate is the proxy's: forward-auth in front of the whole origin, and the
# app's own password stays unset because a second, shared door behind Bloud's
# per-user one would only be worse. See INTEGRATION.md.
sso:
  strategy: forward-auth

containers:
  - name: apps-hermes-webui
    image: ghcr.io/nesquena/hermes-webui:0.52.113
    network: apps-net
    restartPolicy: always
    environment:
      # The web server binds all interfaces because the container network is
      # how Traefik reaches it; the door is forward-auth, not the bind.
      HERMES_WEBUI_HOST: "0.0.0.0"
      HERMES_WEBUI_PORT: "8787"
      # State lives under $HERMES_HOME so one bind mount carries the agent's
      # config, memory, sessions, and the webui's own state together, the way
      # upstream lays it out.
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      HERMES_WEBUI_DEFAULT_WORKSPACE: /workspace
      # No permission-relaxing variable goes here, because none works. Once
      # the agent has run it owns $HERMES_HOME: the tree is chowned to the
      # image's runtime user, which under rootless podman is a host subuid
      # the host agent is not, and the directory ends up 0700. The host can
      # write config.yaml before that first start and never again, so the
      # configurator writes it through the running container instead. See
      # INTEGRATION.md for the measurement.
      #
      # The agent source is installed from a source checkout (see the
      # agent-src mount and INTEGRATION.md), and that checkout's setup.py
      # refuses to build a wheel outside a Nix sandbox. This is the
      # upstream-provided opt-out for exactly that build path.
      HERMES_NIX_BUILD: "1"
    ports:
      - host: 8787
        container: 8787
    volumes:
      # $HERMES_HOME: the agent's config.yaml, memory, skills, session store,
      # and the webui's own state directory.
      - source: "{{appDataDir}}/data"
        destination: /home/hermeswebui/.hermes
      # The Hermes agent source the webui installs into its venv at first
      # boot. Read-only: the webui only reads this tree to build against it,
      # and upstream's own multi-container convention mounts it :ro. The
      # configurator installs it from a pinned, digest-verified archive.
      - source: "{{appDataDir}}/agent-src"
        destination: /home/hermeswebui/.hermes/hermes-agent
        options: [ro]
      # The workspace the file browser and the agent's tools operate on. Kept
      # inside this app's own tree rather than pointed at the shared media
      # libraries: an agent that writes files should write them where its own
      # backup covers them.
      - source: "{{appDataDir}}/workspace"
        destination: /workspace
    healthCheck:
      # /health is the app's own liveness path and one of its PUBLIC_PATHS,
      # so it answers without the app's login and without a session. The
      # image ships curl. The retry budget is wide because first boot builds
      # the venv (the webui's requirements plus the agent's [all] extra)
      # from PyPI inside the container, which is minutes on a cold pull.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/health || exit 1"]
      interval: 5
      timeout: 10
      retries: 180
