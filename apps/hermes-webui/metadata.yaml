# SPDX-License-Identifier: AGPL-3.0-only
name: hermes-webui
displayName: Hermes Web UI
description: Browser front end for the Hermes agent, with sessions, workspaces, and a Control Center
category: productivity
port: 8787
estimatedSizeMB: 1200

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  sso:
    required: false
    multi: false
    compatible:
      - app: authentik
        default: true
  # The agent this UI is a front end for. Required: the image ships no agent
  # of its own, so an install with nothing behind it is a chat window with
  # nobody answering. The edge orders Hermes ahead of this container on the
  # graph and makes the dependency visible instead of implied.
  #
  # The contract carries no payload because the sharing is the payload: this
  # container mounts the same $HERMES_HOME tree Hermes does (see the
  # `hermes/home` volume below), so it reads the same config.yaml. The SSO
  # block, the model selection, and every MCP namespace Bloud writes for
  # Hermes are live here on the same pass, with no wiring on this side. An MCP
  # server added in Hermes shows up in this UI without a change to this app.
  #
  # This is deliberately not the agent's OpenAI-compatible gateway. That
  # would flatten the agent into a model endpoint and drop the sessions,
  # memory, and tool namespaces that make this a front end for *this* agent
  # rather than for any model. It is also upstream's own topology: their two-
  # and three-container compose files mount one `hermes-home` across every
  # surface. See INTEGRATION.md.
  agentHome:
    required: true
    multi: false
    compatible:
      - app: hermes
        default: true

# The app's own login is a single shared password, and its native OIDC client
# will not talk to a home-LAN issuer at all: it requires https for every OIDC
# endpoint and refuses to dial any address that resolves to a private,
# loopback, or link-local IP (api/auth_oidc.py:_validate_outbound_oidc_url),
# which is what `sso.localhost` and a LAN-issued certificate both are. So the
# gate is the proxy's: forward-auth in front of the whole origin, and the
# app's own password stays unset because a second, shared door behind Bloud's
# per-user one would only be worse. See INTEGRATION.md.
sso:
  strategy: forward-auth

containers:
  - name: apps-hermes-webui
    image: ghcr.io/nesquena/hermes-webui:0.52.113
    network: apps-net
    restartPolicy: always
    environment:
      # The web server binds all interfaces because the container network is
      # how Traefik reaches it; the door is forward-auth, not the bind.
      HERMES_WEBUI_HOST: "0.0.0.0"
      HERMES_WEBUI_PORT: "8787"
      # State lives under $HERMES_HOME so one bind mount carries the agent's
      # config, memory, sessions, and the webui's own state together, the way
      # upstream lays it out.
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      HERMES_WEBUI_DEFAULT_WORKSPACE: /workspace
      # The uid every container mounting the shared hermes/home tree must run
      # as, matching HERMES_UID/HERMES_GID on apps/hermes. This image's
      # runtime user is 1024 and the agent's is 10000; unaligned, they are
      # two different host uids under rootless podman and whichever one
      # chowns the shared tree first locks the other out of its own config.
      # Set to 1000 on both sides, both containers land on the same host uid,
      # and the tree is writable by both. Note this is the opposite of the
      # WANTED_UID=0 experiment recorded in INTEGRATION.md: uid 0 breaks the
      # init script's `su` re-exec, uid 1000 does not.
      WANTED_UID: "1000"
      WANTED_GID: "1000"
      # The agent source is installed from a source checkout (see the
      # agent-src mount and INTEGRATION.md), and that checkout's setup.py
      # refuses to build a wheel outside a Nix sandbox. This is the
      # upstream-provided opt-out for exactly that build path.
      HERMES_NIX_BUILD: "1"
    ports:
      - host: 8787
        container: 8787
    volumes:
      # $HERMES_HOME, shared with apps/hermes. Same tree, same config.yaml:
      # the SSO block, the model, the memory, the sessions, and the
      # mcp_servers Bloud writes for Hermes are what this UI reads, which is
      # why an MCP server added on the agent side needs no change here. The
      # tree lives outside apps/ because it belongs to neither app; see
      # dirs.HermesHomeDir.
      - source: "{{dataDir}}/hermes/home"
        destination: /home/hermeswebui/.hermes
      # The Hermes agent source the webui installs into its venv at first
      # boot. Read-only: the webui only reads this tree to build against it,
      # and upstream's own multi-container convention mounts it :ro. The
      # configurator installs it from a pinned, digest-verified archive.
      - source: "{{appDataDir}}/agent-src"
        destination: /home/hermeswebui/.hermes/hermes-agent
        options: [ro]
      # The workspace the file browser and the agent's tools operate on. Kept
      # inside this app's own tree rather than pointed at the shared media
      # libraries: an agent that writes files should write them where its own
      # backup covers them.
      - source: "{{appDataDir}}/workspace"
        destination: /workspace
    healthCheck:
      # /health is the app's own liveness path and one of its PUBLIC_PATHS,
      # so it answers without the app's login and without a session. The
      # image ships curl. The retry budget is wide because first boot builds
      # the venv (the webui's requirements plus the agent's [all] extra)
      # from PyPI inside the container, which is minutes on a cold pull.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/health || exit 1"]
      interval: 5
      timeout: 10
      retries: 180
