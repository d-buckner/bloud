name: appflowy
displayName: AppFlowy
description: Open-source AI-native Notion alternative — docs, databases, and real-time collaboration
category: productivity
port: 8480
estimatedSizeMB: 2000

# AppFlowy's auth layer is its own GoTrue (Supabase Auth) container; the cloud
# API authenticates JWTs minted by GoTrue, so Traefik forward-auth cannot grant
# access (the SPA's API calls need a GoTrue session, not proxy headers). GoTrue's
# custom OIDC provider support enforces an HTTPS issuer, which Bloud's
# self-signed/HTTP SSO issuer does not satisfy. AppFlowy therefore runs with
# strategy "none": local email/password sign-up (auto-confirm, no SMTP needed).
# See apps/appflowy/INTEGRATION.md for the full analysis.
sso:
  strategy: none

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true

# Single private network; only nginx publishes a port (8480) to the host.
# Container-to-container traffic uses fixed names on appflowy-internal.
#
# Secrets injected via template vars (derived from the SSO host secret in
# cmd/host-agent/main.go):
#   {{appflowyGotrueJwtSecret}}     GoTrue JWT signing key (shared with cloud/search)
#   {{appflowyGotrueAdminPassword}} GoTrue admin account password
#   {{appflowyMinioAccessKey}}      MinIO root user (20 chars)
#   {{appflowyMinioSecretKey}}      MinIO root password
#   {{appflowyPublicURL}}           browser-facing base URL (e.g. http://appflowy.localhost:8080)
#   {{appflowyWsURL}}               websocket base URL (e.g. ws://appflowy.localhost:8080/ws/v2)
containers:
  - name: apps-appflowy-postgres
    image: docker.io/pgvector/pgvector:pg16
    network: appflowy-internal
    restartPolicy: always
    environment:
      POSTGRES_PASSWORD: "{{postgresPassword}}"
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - source: "{{appDataDir}}/postgres"
        destination: /var/lib/postgresql/data
    healthCheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5
      timeout: 5
      retries: 12

  - name: apps-appflowy-redis
    image: docker.io/library/redis:7-alpine
    network: appflowy-internal
    restartPolicy: always
    healthCheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5
      timeout: 5
      retries: 5

  - name: apps-appflowy-minio
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    network: appflowy-internal
    restartPolicy: always
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "{{appflowyMinioAccessKey}}"
      MINIO_ROOT_PASSWORD: "{{appflowyMinioSecretKey}}"
    volumes:
      - source: "{{appDataDir}}/minio"
        destination: /data
    healthCheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10
      timeout: 10
      retries: 6

  - name: apps-appflowy-gotrue
    image: docker.io/appflowyinc/gotrue:0.17.12
    network: appflowy-internal
    restartPolicy: always
    environment:
      DATABASE_URL: "postgres://postgres:{{postgresPassword}}@apps-appflowy-postgres:5432/postgres?search_path=auth"
      GOTRUE_DB_DRIVER: postgres
      API_EXTERNAL_URL: "{{appflowyPublicURL}}/gotrue"
      GOTRUE_SITE_URL: "appflowy-flutter://"
      GOTRUE_URI_ALLOW_LIST: "**"
      GOTRUE_ADMIN_EMAIL: "admin@appflowy.local"
      GOTRUE_ADMIN_PASSWORD: "{{appflowyGotrueAdminPassword}}"
      GOTRUE_JWT_SECRET: "{{appflowyGotrueJwtSecret}}"
      GOTRUE_JWT_EXP: "604800"
      GOTRUE_JWT_ADMIN_GROUP_NAME: supabase_admin
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /gotrue/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /gotrue/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /gotrue/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /gotrue/verify
      PORT: "9999"
    healthCheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9999/health"]
      interval: 5
      timeout: 5
      retries: 24
    dependsOn:
      - apps-appflowy-postgres

  - name: apps-appflowy-cloud
    image: docker.io/appflowyinc/appflowy_cloud:0.17.12
    network: appflowy-internal
    restartPolicy: always
    environment:
      RUST_LOG: info
      APPFLOWY_ENVIRONMENT: production
      APPFLOWY_DATABASE_URL: "postgres://postgres:{{postgresPassword}}@apps-appflowy-postgres:5432/postgres"
      APPFLOWY_DATABASE_MAX_CONNECTIONS: "40"
      APPFLOWY_REDIS_URI: "redis://apps-appflowy-redis:6379"
      APPFLOWY_GOTRUE_JWT_SECRET: "{{appflowyGotrueJwtSecret}}"
      APPFLOWY_GOTRUE_BASE_URL: "http://apps-appflowy-gotrue:9999"
      APPFLOWY_ACCESS_CONTROL: "true"
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_CREATE_BUCKET: "true"
      APPFLOWY_S3_MINIO_URL: "http://apps-appflowy-minio:9000"
      APPFLOWY_S3_ACCESS_KEY: "{{appflowyMinioAccessKey}}"
      APPFLOWY_S3_SECRET_KEY: "{{appflowyMinioSecretKey}}"
      APPFLOWY_S3_BUCKET: appflowy
      APPFLOWY_S3_PRESIGNED_URL_ENDPOINT: "{{appflowyPublicURL}}/minio-api"
      APPFLOWY_BASE_URL: "{{appflowyPublicURL}}"
      APPFLOWY_WEB_URL: "{{appflowyPublicURL}}"
      # The image default points at the compose service name "appflowy_search"
      # (underscore), which does not exist here.
      APPFLOWY_SEARCH_SERVICE_URL: "http://apps-appflowy-search:4002"
    healthCheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/api/health"]
      interval: 5
      timeout: 5
      retries: 24
    dependsOn:
      - apps-appflowy-postgres
      - apps-appflowy-redis
      - apps-appflowy-minio
      - apps-appflowy-gotrue

  - name: apps-appflowy-worker
    image: docker.io/appflowyinc/appflowy_worker:0.17.12
    network: appflowy-internal
    restartPolicy: always
    # No healthCheck: the runtime image ships no curl/wget/nc and its sh is
    # dash (no /dev/tcp), so no in-container probe is possible. Nothing
    # depends on the worker, so convergence does not gate on it.
    environment:
      RUST_LOG: info
      APPFLOWY_ENVIRONMENT: production
      APPFLOWY_WORKER_ENVIRONMENT: production
      APPFLOWY_WORKER_REDIS_URL: "redis://apps-appflowy-redis:6379"
      APPFLOWY_WORKER_DATABASE_URL: "postgres://postgres:{{postgresPassword}}@apps-appflowy-postgres:5432/postgres"
      APPFLOWY_WORKER_DATABASE_NAME: postgres
      APPFLOWY_WORKER_IMPORT_TICK_INTERVAL: "30"
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_MINIO_URL: "http://apps-appflowy-minio:9000"
      APPFLOWY_S3_ACCESS_KEY: "{{appflowyMinioAccessKey}}"
      APPFLOWY_S3_SECRET_KEY: "{{appflowyMinioSecretKey}}"
      APPFLOWY_S3_BUCKET: appflowy
    dependsOn:
      - apps-appflowy-postgres
      - apps-appflowy-redis

  - name: apps-appflowy-search
    image: docker.io/appflowyinc/appflowy_search:0.17.12
    network: appflowy-internal
    restartPolicy: always
    environment:
      RUST_LOG: info
      APPFLOWY_SEARCH_HOST: "0.0.0.0"
      APPFLOWY_SEARCH_PORT: "4002"
      APPFLOWY_SEARCH_DATABASE_URL: "postgres://postgres:{{postgresPassword}}@apps-appflowy-postgres:5432/postgres"
      APPFLOWY_SEARCH_REDIS_URL: "redis://apps-appflowy-redis:6379"
      APPFLOWY_BACKGROUND_INDEXER_ENABLED: "true"
      APPFLOWY_KEYWORD_SEARCH_ENABLED: "true"
      APPFLOWY_KEYWORD_WORKER_ENABLED: "true"
      APPFLOWY_KEYWORD_INDEX_DIR: /var/lib/appflowy/keyword_index
      APPFLOWY_GOTRUE_JWT_SECRET: "{{appflowyGotrueJwtSecret}}"
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_MINIO_URL: "http://apps-appflowy-minio:9000"
      APPFLOWY_S3_ACCESS_KEY: "{{appflowyMinioAccessKey}}"
      APPFLOWY_S3_SECRET_KEY: "{{appflowyMinioSecretKey}}"
      APPFLOWY_S3_BUCKET: appflowy
    volumes:
      - source: "{{appDataDir}}/keyword-index"
        destination: /var/lib/appflowy/keyword_index
    healthCheck:
      # The runtime image has no curl/wget; bash's /dev/tcp provides an
      # HTTP-level probe (mirrors the official docker-compose healthcheck).
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/4002; printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r _ status _ <&3; [ \"$status\" = 200 ]"
      interval: 5
      timeout: 5
      retries: 24
    dependsOn:
      - apps-appflowy-postgres
      - apps-appflowy-redis

  - name: apps-appflowy-web
    image: docker.io/appflowyinc/appflowy_web:0.16.18
    network: appflowy-internal
    restartPolicy: always
    environment:
      APPFLOWY_BASE_URL: "{{appflowyPublicURL}}"
      APPFLOWY_GOTRUE_BASE_URL: "{{appflowyPublicURL}}/gotrue"
      APPFLOWY_WS_BASE_URL: "{{appflowyWsURL}}"
    healthCheck:
      # The bun-based image has no curl/wget; bun itself provides fetch.
      test:
        - CMD-SHELL
        - "bun -e 'fetch(\"http://127.0.0.1:80/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"
      interval: 5
      timeout: 10
      retries: 24
    dependsOn:
      - apps-appflowy-cloud

  - name: apps-appflowy-nginx
    image: docker.io/library/nginx:1.31.4-alpine-perl
    network: appflowy-internal
    restartPolicy: always
    ports:
      - host: 8480
        container: 80
    volumes:
      # Written by the appflowy configurator (PreStart) with mode 0644 so the
      # unprivileged nginx worker can read it.
      - source: "{{appDataDir}}/config/nginx.conf"
        destination: /etc/nginx/nginx.conf
        options: [ro]
    healthCheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/health"]
      interval: 10
      timeout: 10
      retries: 12
    dependsOn:
      - apps-appflowy-web
