# SPDX-License-Identifier: AGPL-3.0-only
name: caldav-mcp
displayName: CalDAV MCP
description: MCP tool server for the calendars Bloud already serves, so agents read and write events and to-dos
category: productivity
port: 9333
estimatedSizeMB: 150

# No browser UI: the wrapper serves an MCP endpoint and nothing to click, so the
# dashboard draws no tile for it. It is otherwise an ordinary app: installed,
# reconciled, and routed like every other.
headless: true

# A wrapper, not the calendar server itself: caldav-mcp is a stdio MCP server,
# so this app runs it behind supergateway (which bridges stdio to streamable
# HTTP and enforces the bearer). The wrapper is not a browser and cannot join
# the identity provider, so it authenticates to Radicale with the caldav-service
# account credential, published under Radicale's `appApi` offer; the DAV address
# comes from the `caldav` contract.
integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  # The DAV server's address. `caldav` carries no credential (a browser client
  # authenticates the person), so this is only the address.
  caldav:
    required: true
    multi: false
    compatible:
      - app: radicale
        default: true
  # The machine credential: Radicale publishes the caldav-service account's
  # username (a value) and password (the secret). `requires: [password]` is the
  # whole dependency; the username arrives without being asked for, and an empty
  # password means "not ready", never an empty credential.
  appApi:
    required: true
    multi: false
    requires:
      - password
    compatible:
      - app: radicale
        default: true

# The `mcp` contract a harness (Hermes) consumes, under a `caldav-mcp` namespace.
provides:
  mcp:
    secrets: [httpToken]
    values:
      serverName: caldav-mcp
      path: /mcp

containers:
  - name: apps-caldav-mcp
    image: ghcr.io/supercorp-ai/supergateway:4.1.0
    network: apps-net
    restartPolicy: always
    # The image's own entrypoint is `supergateway`, which would bind the port
    # before the bridged package exists on disk. This wrapper installs the pin
    # into the persistent /runtime prefix once and then execs the gateway with
    # the flags below, so no MCP session ever waits on npm resolution. Run
    # through /bin/sh so the managed file does not need the executable bit.
    entrypoint:
      - /bin/sh
      - /config/entrypoint.sh
    command:
      # These are supergateway's flags, handed to it by the entrypoint wrapper.
      # `--stdio` runs the generated /config/run.sh (which exports the
      # CALDAV_* environment and execs the installed caldav-mcp entrypoint)
      # and bridges it to streamable HTTP.
      - --stdio
      - sh /config/run.sh
      - --outputTransport
      - streamableHttp
      - --streamableHttpPath
      - /mcp
      - --port
      - "8000"
      - --healthEndpoint
      - /healthz
    ports:
      - host: 9333
        container: 8000
    volumes:
      # The configurator writes the entrypoint wrapper and run.sh (the CALDAV_*
      # environment for the stdio server) into this mounted dir.
      - source: "{{appDataDir}}/config"
        destination: /config
      # The persistent npm prefix. It lives in the app's own data tree so the
      # package install survives a container recreate: the cost is paid once per
      # pin rather than once per spawn, and a restart needs no registry.
      - source: "{{appDataDir}}/runtime"
        destination: /runtime
    healthCheck:
      # /healthz is the gateway's own liveness path, answered "ok" while it is
      # up and serving. It says nothing about the bridged server, which is why
      # the functional gate is the MCP handshake in PostStart: this probe keeps
      # the container honest about the process it runs, and a cheap per-spawn
      # MCP round trip every 5s is not what a liveness probe should be.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz | grep -q ok"]
      interval: 5
      timeout: 10
      retries: 30
