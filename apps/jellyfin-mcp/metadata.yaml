# SPDX-License-Identifier: AGPL-3.0-only
name: jellyfin-mcp
displayName: Jellyfin MCP
description: MCP tool server over the media library Bloud already serves, so an agent can search, browse, and manage Jellyfin
category: productivity
port: 9334
estimatedSizeMB: 175

# No browser UI: the wrapper serves an MCP endpoint and nothing to click, so the
# dashboard draws no tile for it. It is otherwise an ordinary app: installed,
# reconciled, and routed like every other.
headless: true

# A wrapper, not the media server. jellyfin-mcp (jaredtrent/jellyfin-mcp)
# serves streamable HTTP itself, so there is no bridge process in front of it:
# one container speaks MCP on one port and talks the Jellyfin REST API out to
# the media server. The wrapper is not a browser and cannot join the identity
# provider, so it reaches Jellyfin with a dedicated API key Bloud mints on its
# behalf; the media server's address and its bootstrap credential come from the
# `mediaServer` contract.
integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  # The media server's address, and the bootstrap admin password this app logs
  # in with to mint its own key. `requires: [adminPassword]` is the whole
  # consumer surface: the address arrives with the graph edge and no credential
  # is handed over that was not asked for. Required, because a media tool server
  # with no media server has nothing to serve; the edge this declares is what
  # orders Jellyfin's convergence ahead of this node's PreStart, which is where
  # the key gets minted.
  mediaServer:
    required: true
    multi: false
    requires:
      - adminPassword
    compatible:
      - app: jellyfin
        default: true

# The `mcp` contract a harness (Hermes) consumes, under a `jellyfin-mcp`
# namespace. `httpToken` is the bearer this app's own listener requires, so the
# credential a harness presents is checked by the thing it was given rather
# than being a name that authenticates against nothing.
provides:
  mcp:
    secrets: [httpToken]
    values:
      serverName: jellyfin-mcp
      path: /mcp

containers:
  - name: apps-jellyfin-mcp
    # jellyfin-mcp 2026.924.1. Pinned by digest as well as by tag: a tag names
    # a moving pointer on any registry, and the digest is the only reference
    # that means the same bytes twice. Unlike the wrapper this replaced, this
    # upstream does publish version tags (`2026.924.1`, `2026.924`, `edge`,
    # `sha-<commit>`), so the tag carries the intent and the digest carries the
    # evidence.
    #
    # Multi-arch: linux/amd64 and linux/arm64, so this installs on an ARM host.
    # The image it replaced was amd64-only, which was a documented limitation
    # rather than a choice.
    image: ghcr.io/jaredtrent/jellyfin-mcp:2026.924.1@sha256:47877d8cf5282a3dea35c2bfa4b8331ea4cb543093091a37a27aa834cbbab2a0
    network: apps-net
    restartPolicy: always
    # Replaces the image's own CMD, which is `--http --addr 0.0.0.0:8080`. The
    # entrypoint (the binary) is left alone. The address is moved to 9334 so the
    # container port, the published port, and the catalog `port` are one number
    # with no translation layer to keep straight.
    #
    # `--disable-destructive` is the guardrail: the agent may write (metadata,
    # libraries, playlists, tasks) but not delete, restart, revoke, or rewrite
    # whole configuration. The Jellyfin key this app mints is full-privilege,
    # so this is the only layer that stands between "the agent may manage the
    # library" and "the agent may empty it".
    command:
      - --http
      - --addr
      - "0.0.0.0:9334"
      - --disable-destructive
    ports:
      - host: 9334
        container: 9334
    # Written by the configurator on every pass: the resolved Jellyfin address,
    # the Jellyfin API key minted for this app, and the bearer this app's
    # listener requires. The image reads its configuration from process env and
    # nothing else, so this is the only way a resolved binding reaches it. The
    # file lives in the app's own data tree and is not mounted: the runtime
    # reads it on the host and passes the values in at create time.
    #
    # The bearer goes in as `HTTP_TOKEN` rather than `--http-token` precisely
    # because it is an argument list: the flag would put the credential in the
    # process list, where any local process can read it.
    envFile: "{{appDataDir}}/config/env"
    healthCheck:
      # Exec form, because the check names the interpreter directly. This is the
      # image's own liveness probe (its Dockerfile HEALTHCHECK is the same wget)
      # with the port fixed to the one set above rather than read from the
      # environment.
      #
      # /health is served unauthenticated and says nothing about Jellyfin or
      # about the MCP layer: it answers 200 as long as the process is up. That
      # is the right job for a liveness probe. The functional gate is PostStart,
      # where a failure can be reported without flapping the container.
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:9334/health",
        ]
      interval: 5
      timeout: 10
      retries: 30
