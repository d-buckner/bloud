# SPDX-License-Identifier: AGPL-3.0-only
name: radicale
displayName: Radicale
description: CalDAV and CardDAV server for calendars, contacts, and to-do lists
category: productivity
port: 5232
estimatedSizeMB: 150

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  sso:
    required: false
    multi: false
    # The shared calendar has to know who the Bloud users are, and the identity
    # provider is the only place that answer lives. Declaring the contract alone
    # gets the provider's address; `apiToken` is what lets the configurator
    # read the user list it map-shares to (invariant 15). Without it the
    # shares stay exactly as they were on the last pass that could read the
    # directory, rather than collapsing to nobody.
    requires:
      - apiToken
    compatible:
      - app: authentik
        default: true

  # Calendar feeds other apps publish. Radicale's ics-sync storage subscribes
  # to each one server-side and projects the events into a collection under the
  # operator's own account, so the user adds one CalDAV account and inherits
  # every feed the instance has. `multi: true` because the point is to
  # aggregate as many feeds as the catalog provides, and optional because
  # Radicale serves the user's own calendars with no feeds at all.
  #
  # `requires: [apiKey]` is the whole consumer surface: the provider's feed
  # endpoint authenticates with `?apikey=`, because neither the plugin nor a
  # calendar client can set an X-Api-Key header.
  icsFeed:
    required: false
    multi: true
    requires:
      - apiKey
    compatible:
      - app: radarr
      - app: sonarr

# Radicale speaks CalDAV and CardDAV to desktop, mobile, and terminal clients
# that authenticate with a username and password on every request. None of them
# can follow a browser redirect to a login page, so the SSO strategy is `ldap`:
# the app verifies the Bloud password against the Authentik LDAP outpost, the
# same way Jellyfin does. `forward-auth` would put a 302 in front of every
# calendar sync and break it.
#
# Radicale reads no environment variables for its settings, so everything below
# lives in the INI file the configurator writes into <appDataDir>/config and the
# container is pointed at with `--config`.
sso:
  strategy: ldap

# What this server offers to the apps that integrate with it as a calendar
# server.
#
# `caldav` carries no secret: a browser or desktop client authenticates the
# person with the password they send, verified against the identity provider
# over LDAP, so there is no machine credential to hand out there. The DAV root
# is the one fact a consumer cannot guess, so it is declared.
#
# `appApi` is the separate machine credential: the username and password of the
# caldav-service account Bloud provisions, for a companion that is not a
# browser (dav-mcp) and therefore cannot join the identity provider. The
# password is published by the Authentik configurator; the rights model scopes
# what the account can read.
#
# `username` is under operatorValues because that account name is a fact about
# the Radicale Bloud booted, not about Radicale. A remote server has its own
# service account with its own name, so the form asks rather than inheriting a
# constant that would authenticate against nothing.
provides:
  caldav:
    values:
      path: /
  appApi:
    secrets: [password]
    values:
      username: caldav-service
    operatorValues: [username]

# Order matters here. The last container in this list is the app's primary
# node: it is what other apps' dependency edges on `radicale` resolve to, and
# what SSO resolution keys off. The server keeps that position; the sidecar
# comes first.
containers:
  # The feed sync. A separate container rather than a plugin inside Radicale:
  # it speaks CalDAV to the running server the way any client does, so it can
  # be restarted without disturbing the server, and it creates the collection
  # it fills instead of reaching into the storage layer to place one.
  - name: apps-radicale-pimsync
    # Upstream pimsync publishes no container image. This is
    # Bleala/Pimsync-DOCKERIZED 1.0.9, which packages upstream pimsync
    # 0.6.0, pinned by the multi-arch index digest so the bytes are fixed
    # regardless of how the tags move. See the Image provenance section of
    # INTEGRATION.md.
    image: docker.io/bleala/pimsync@sha256:0a92e4a733a101daf8ccd141e84894908791f831f7b7b7f067e357bcee48171b
    network: apps-net
    restartPolicy: always
    dependsOn:
      - apps-radicale
    # The image's own entrypoint is a supervision script driven by a pile of
    # PIMSYNC_* environment variables. Replacing it keeps Bloud out of that
    # contract, and it is necessary rather than merely tidy: `pimsync daemon`
    # with zero pairs returns immediately, which under restartPolicy=always is
    # a crash loop. So this parks while there is nothing to sync, and starts
    # syncing when a feed provider turns up.
    #
    # `sync` in a loop, not `daemon`. The daemon is the wrong shape here: if
    # the CalDAV target is unreachable when it starts, it initialises the pair
    # and then sits there without erroring, so the next attempt is not until
    # the storage interval, an hour later. That is not a hypothetical. The
    # sidecar's own PostStart restarts it when the feed list changes, and the
    # Radicale node restarts when its shares change, which is the same pass,
    # so the sidecar routinely comes up against a calendar server that is not
    # answering yet. A bounded `sync` per turn means a failed attempt costs
    # one sleep, not an hour.
    #
    # tini is kept from the image's own entrypoint. It is what reaps children
    # and forwards signals to them; a bare /bin/sh as PID 1 would leave the
    # sync running until the grace period expired on every stop.
    entrypoint:
      - /sbin/tini
      - --
      - /bin/sh
      - -c
    command:
      - |
        while :; do
          if grep -q '^pair ' /etc/pimsync/pimsync.conf 2>/dev/null; then
            /usr/local/bin/pimsync -c /etc/pimsync/pimsync.conf -v warn sync || true
          fi
          sleep 60
        done
    volumes:
      # The rendered config, read-only. Written by the sidecar's own PreStart.
      - source: "{{appDataDir}}/pimsync"
        destination: /etc/pimsync
        options: [ro]
      # pimsync's status database. The container writes it as its own uid
      # 1000, which under rootless podman is a subordinate uid the host agent
      # cannot become, so the configurator opens the directory rather than
      # owning it.
      - source: "{{appDataDir}}/pimsync-status"
        destination: /var/lib/pimsync

  - name: apps-radicale
    # The upstream image is built with the bcrypt, argon2, and ldap extras
    # (see .github/workflows/docker-publish.yml in Kozea/Radicale), which is
    # what puts ldap3 in the venv this app's auth backend imports.
    image: ghcr.io/kozea/radicale:3.8.1
    network: apps-net
    restartPolicy: always
    # Replaces the image's default `--hosts 0.0.0.0:5232,...`, so the bind
    # address now comes from [server] hosts in the generated config.
    command:
      - --config
      - /config/config
    # Radicale reads no environment variables for its settings, so nothing
    # here is configuration; the app is configured entirely by the INI file
    # mounted at /config.
    ports:
      - host: 5232
        container: 5232
    volumes:
      # The storage tree. The image runs as its own `radicale` uid, so this is
      # the one mount the container writes as a non-host user; the configurator
      # widens it and owns the layout.
      - source: "{{appDataDir}}/collections"
        destination: /var/lib/radicale/collections
      # Generated config + LDAP reader secret, read-only: the app never writes
      # back into its own configuration.
      - source: "{{appDataDir}}/config"
        destination: /config
        options: [ro]
    healthCheck:
      # GET / answers 302 to the built-in web UI once the server is listening.
      # `-f` treats 3xx as success, so this goes green on a serving process and
      # not on anything about authentication.
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:5232/ || exit 1"]
      interval: 5
      timeout: 10
      retries: 12
