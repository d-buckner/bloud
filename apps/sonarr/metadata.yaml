# SPDX-License-Identifier: AGPL-3.0-only
name: sonarr
displayName: Sonarr
description: PVR for TV series that monitors, grabs, and organises episodes
category: media
port: 8989
estimatedSizeMB: 250

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  sso:
    required: false
    multi: false
    compatible:
      - app: authentik
        default: true

  downloadClient:
    required: false
    multi: false
    compatible:
      - app: qbittorrent
        default: true

# SSO via Authentik forward-auth. Sonarr has no trusted-header mode, so the
# configurator puts it into Servarr's built-in "External" authentication
# (AuthenticationMethod=External, AuthenticationRequired=Enabled in
# config.xml). External installs the app's NoAuthenticationHandler: it reads
# no username header at all and treats every request as authenticated.
#
# Consequence, stated plainly: the published host port (8989) is
# UNAUTHENTICATED. Traefik's forward-auth middleware is the only gate, so the
# port must never be reachable from an untrusted host. Bloud's dev VM does not
# port-forward it off the machine, and no deployment should.
sso:
  strategy: forward-auth

# This instance's ApiKey, offered to the apps that integrate with it as a PVR:
# Prowlarr (indexer sync) and Seerr (request fulfilment) receive it in their
# `pvr` binding, so neither ever opens this instance's config.xml.
provides:
  pvr:
    secrets: [apiKey]

containers:
  - name: apps-sonarr
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls325
    network: apps-net
    restartPolicy: always
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    ports:
      - host: 8989
        container: 8989
    volumes:
      - source: "{{appDataDir}}/config"
        destination: /config
      - source: "{{dataDir}}/media/shows"
        destination: /shows
      - source: "{{dataDir}}/downloads"
        destination: /downloads
    healthCheck:
      # /ping is the one route the app leaves anonymous and answers 503 with
      # "is starting up" until the database and web host are ready.
      test: ["CMD-SHELL", "curl -sf http://localhost:8989/ping"]
      interval: 5
      timeout: 10
      retries: 24
