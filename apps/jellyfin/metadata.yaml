# SPDX-License-Identifier: AGPL-3.0-only
name: jellyfin
displayName: Jellyfin
description: Free software media system for streaming movies, TV, and music
category: media
port: 8096
estimatedSizeMB: 1150

integrations:
  proxy:
    required: true
    multi: false
    compatible:
      - app: traefik
        default: true
  sso:
    required: false
    multi: false
    compatible:
      - app: authentik
        default: true
# Jellyfin is a source app: it provides the media server Seerr onboards
# against.

# The bootstrap admin password, offered to the apps that integrate with this one
# as a media server. It is the password the host generates for this app
# (GenerateAppAdminPassword, the account apps/jellyfin creates and never
# deletes), so there is nothing to store separately: declaring the name is what
# puts it in a consumer's binding. Seerr logs in with it to mint its own
# Jellyfin API key.
provides:
  mediaServer:
    secrets: [adminPassword]

# LDAP SSO for TV apps, mobile clients, and other non-web interfaces
# The web UI could also support OIDC in the future, but LDAP covers more use cases
sso:
  strategy: ldap

containers:
  - name: apps-jellyfin
    image: docker.io/jellyfin/jellyfin:10.11.11
    network: apps-net
    restartPolicy: always
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    ports:
      - host: 8096
        container: 8096
    volumes:
      - source: "{{appDataDir}}/config"
        destination: /config
      - source: "{{appDataDir}}/cache"
        destination: /cache
      - source: "{{dataDir}}/media/movies"
        destination: /movies
        options: [ro]
      - source: "{{dataDir}}/media/shows"
        destination: /shows
        options: [ro]
    healthCheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096/System/Info/Public"]
      interval: 2
      timeout: 10
      retries: 60
