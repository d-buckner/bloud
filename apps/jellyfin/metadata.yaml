name: jellyfin
displayName: Jellyfin
description: Free software media system for streaming movies, TV, and music
category: media
port: 8096

integrations: {}
# Jellyfin is a source app - provides media server to Jellyseerr

# LDAP SSO for TV apps, mobile clients, and other non-web interfaces
# The web UI could also support OIDC in the future, but LDAP covers more use cases
sso:
  strategy: ldap

healthCheck:
  path: /health
  interval: 5
  timeout: 60

container:
  name: apps-jellyfin
  image: docker.io/jellyfin/jellyfin:10.11.7
  network: apps-net
  restartPolicy: always
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: Etc/UTC
  ports:
    - host: 8096
      container: 8096
  volumes:
    - source: "{{appDataDir}}/config"
      destination: /config
    - source: "{{appDataDir}}/cache"
      destination: /cache
    - source: "{{dataDir}}/media/movies"
      destination: /movies
      options: [ro]
    - source: "{{dataDir}}/media/shows"
      destination: /shows
      options: [ro]
