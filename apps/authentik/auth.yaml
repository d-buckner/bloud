# Bloud override for Authentik's default authentication flow blueprint.
# Replaces /blueprints/default/flow-default-authentication-flow.yaml inside the container
# so username-only identification is set at the source rather than fighting ordering.
#
# The only change from the upstream default is user_fields: [username] instead of
# [email, username]. Everything else is identical to the Authentik upstream file.
# Flow title is intentionally left as "Welcome to authentik!" — PostStart sets it
# to "Sign in to Bloud" via API, which serves as the smoke test synchronization signal
# (CSS is applied before the title is set).
version: 1
metadata:
  name: Default - Authentication flow
entries:
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - Password change flow
    required: false
# Remove the upstream default flow (slug renamed to 'auth')
- identifiers:
    slug: default-authentication-flow
  model: authentik_flows.flow
  state: absent
- attrs:
    designation: authentication
    name: Welcome to authentik!
    title: Welcome to authentik!
    authentication: none
  identifiers:
    slug: auth
  model: authentik_flows.flow
  id: flow
- attrs:
    backends:
    - authentik.core.auth.InbuiltBackend
    - authentik.sources.kerberos.auth.KerberosBackend
    - authentik.sources.ldap.auth.LDAPBackend
    - authentik.core.auth.TokenBackend
    configure_flow: !Find [authentik_flows.flow, [slug, default-password-change]]
  identifiers:
    name: default-authentication-password
  id: default-authentication-password
  model: authentik_stages_password.passwordstage
- identifiers:
    name: default-authentication-mfa-validation
  id: default-authentication-mfa-validation
  model: authentik_stages_authenticator_validate.authenticatorvalidatestage
- attrs:
    user_fields:
    - username
  identifiers:
    name: default-authentication-identification
  id: default-authentication-identification
  model: authentik_stages_identification.identificationstage
- identifiers:
    name: default-authentication-login
  id: default-authentication-login
  model: authentik_stages_user_login.userloginstage
- identifiers:
    order: 10
    stage: !KeyOf default-authentication-identification
    target: !KeyOf flow
  model: authentik_flows.flowstagebinding
- identifiers:
    order: 20
    stage: !KeyOf default-authentication-password
    target: !KeyOf flow
  attrs:
    re_evaluate_policies: true
  id: auth-flow-password-binding
  model: authentik_flows.flowstagebinding
- identifiers:
    order: 30
    stage: !KeyOf default-authentication-mfa-validation
    target: !KeyOf flow
  id: auth-flow-authenticator-validation-binding
  model: authentik_flows.flowstagebinding
- identifiers:
    order: 100
    stage: !KeyOf default-authentication-login
    target: !KeyOf flow
  model: authentik_flows.flowstagebinding
- model: authentik_policies_expression.expressionpolicy
  id: auth-flow-password-optional
  identifiers:
    name: auth-flow-password-stage
  attrs:
    expression: |
      flow_plan = request.context.get("flow_plan")
      if not flow_plan:
          return True
      # If the user does not have a backend attached to it, they haven't
      # been authenticated yet and we need the password stage
      return not hasattr(flow_plan.context.get("pending_user"), "backend")
- model: authentik_policies_expression.expressionpolicy
  id: auth-flow-authenticator-validate-optional
  identifiers:
    name: auth-flow-authenticator-validate-stage
  attrs:
    expression: |
      flow_plan = request.context.get("flow_plan")
      if not flow_plan:
          return True
      # if the authentication method is webauthn (passwordless), then we skip the authenticator
      # validation stage by returning false (true will execute the stage)
      return not (flow_plan.context.get("auth_method") == "auth_webauthn_pwl")
- model: authentik_policies.policybinding
  identifiers:
    order: 10
    target: !KeyOf auth-flow-password-binding
    policy: !KeyOf auth-flow-password-optional
  attrs:
    failure_result: true
- model: authentik_policies.policybinding
  identifiers:
    order: 10
    target: !KeyOf auth-flow-authenticator-validation-binding
    policy: !KeyOf auth-flow-authenticator-validate-optional
  attrs:
    failure_result: true
