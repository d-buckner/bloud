# Authentik Blueprint for Bloud Branding
# Applies custom branding to match the Bloud design system
# CSS source: services/host-agent/web/static/authentik-branding.css
version: 1
metadata:
  name: bloud-brand
  labels:
    managed-by: bloud

entries:
  # Update the default brand with Bloud branding
  # Note: branding_custom_css is NOT set here — it is pushed inline via the
  # configurator PostStart. Authentik uses Constructable Stylesheets which
  # forbid @import rules, so the full CSS must be set via the API, not here.
  # Setting it here would wipe whatever the configurator pushed.
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    state: present
    attrs:
      default: true
      branding_title: Bloud
      branding_logo: /images/logo.svg
      branding_favicon: /images/favicon.svg
      attributes:
        settings:
          theme:
            base: light
