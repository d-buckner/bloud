# Authentik Blueprint for Bloud Branding — SOURCE TEMPLATE
#
# This file is a template only. The deployed blueprint is generated by module.nix
# at Nix evaluation time with the CSS from authentik-branding.css inlined into the
# branding_custom_css field. Do not add branding_custom_css here.
#
# CSS source: services/host-agent/web/static/authentik-branding.css
version: 1
metadata:
  name: bloud-brand
  labels:
    managed-by: bloud

entries:
  # Update authentication flow title
  - model: authentik_flows.flow
    identifiers:
      slug: default-authentication-flow
    state: present
    attrs:
      title: Sign in to Bloud

  # Show only username field (not email) on the login page
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    state: present
    attrs:
      user_fields:
        - username

  # Update the default brand with Bloud branding.
  # branding_custom_css is injected by module.nix at build time (see above).
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    state: present
    attrs:
      default: true
      branding_title: Bloud
      branding_logo: /images/logo.svg
      branding_favicon: /images/favicon.svg
      attributes:
        settings:
          theme:
            base: light
