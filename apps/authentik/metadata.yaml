name: authentik
displayName: Authentik
description: Open-source identity provider for SSO, user management, and authentication
category: security
port: 9001
isSystem: true

integrations:
  database:
    required: true
    multi: false
    compatible:
      - app: postgres
        default: true
  cache:
    required: true
    multi: false
    compatible:
      - app: redis
        default: true

healthCheck:
  path: /-/health/live/
  interval: 2
  timeout: 90
