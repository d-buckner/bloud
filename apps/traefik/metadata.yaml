name: traefik
displayName: Traefik
description: Cloud-native reverse proxy and load balancer with automatic HTTPS
category: network
port: 8080
isSystem: true

integrations: {}

containers:
  - name: apps-traefik
    image: docker.io/traefik:v3.4
    network: host
    restartPolicy: always
    volumes:
      - source: "{{dataDir}}/traefik/traefik.yml"
        destination: /etc/traefik/traefik.yml
        options: [ro]
      - source: "{{dataDir}}/traefik/dynamic"
        destination: /dynamic
        options: [ro]
    healthCheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping | grep -qi ok"]
      interval: 1
      timeout: 5
      retries: 30
