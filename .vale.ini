; Copyright (c) 2026 Daniel Buckner
;
; Vale prose linter for the repository's Markdown documentation and the comments
; in its source files.
; Run `npm run lint:prose`; also a command in the fast validation tier.

StylesPath = .vale/styles
MinAlertLevel = suggestion

; Domain vocabulary -- product names, host-agent internals, catalog and
; container terms: .vale/styles/config/vocabularies/Bloud/accept.txt
Vocab = Bloud

; Pinned by release URL rather than by package name, so an upstream rule cannot
; arrive and change the gate unnoticed. `vale sync` installs it into the
; gitignored StylesPath.
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Bloud, Google

; Vale exits nonzero only on error-severity alerts. Upstream Google rules ship at
; a mix of levels: most of the ones kept here already arrive as `error`, while the
; four below arrive as warning or suggestion, so they are pinned to `error` to
; gate. A rule added by a `Packages` bump keeps its upstream level, so check that
; level before assuming a new rule blocks.
Google.HeadingPunctuation = error
Google.Jargon = error
Google.Ranges = error
Google.Spelling = error

; --- Google rules switched off, and why --------------------------------------
; Two groups: the rule contradicts a deliberate house convention, or it produces
; false positives on this repo's prose (so fixing only the true hits is not
; possible).

; House style. A parenthetical aside and a semicolon are the docs' two main
; compression devices; AGENTS.md reads the same way. Contractions and the
; passive voice are deliberate, for brevity.
Google.Parens = NO
Google.Semicolons = NO
Google.Contractions = NO
Google.Passive = NO
; The audience knows these acronyms; expanding SSO/OIDC/AGPL on first use in
; every doc is noise, not clarity. "e.g.", "i.e.", and "etc." are deliberate.
Google.Acronyms = NO
Google.Latin = NO
; Google's word list assumes a marketing audience: CLI -> "command-line tool"
; (CLI is this repo's own product term), admin -> "administrator",
; OAuth -> "OAuth 2.0", application -> "app" (a catalog entry here, not a
; synonym for "program").
Google.WordList = NO
Google.WordListCase = NO
; Half the headings are proper nouns or code -- "host-agent HTTP API (port
; 3000)", "AGENTS.md: Bloud" -- so sentence-casing them would make them wrong.
Google.Headings = NO
; The colon rule lowercases the word after a colon, which mangles labels
; ("Status: Complete") and code-ish colons.
Google.Colons = NO

; Voice. These assume end-user product prose written from outside. The specs and
; dated reviews state the shipped state against the target state and attribute
; findings to an author ("I verified the line ordering"; the README's personal
; note), so rewriting them to third person would misreport the record rather
; than improve it. `We` additionally fires on "Let's Encrypt".
Google.We = NO
Google.FirstPerson = NO
Google.Timeless = NO
Google.Anthropomorphism = NO
; Most hits describe genuinely future work -- roadmap items in the plans, "a
; future change will add ...", "future-you will be grateful" -- which the rule
; cannot tell from a claim about present behaviour. (The remaining hits are
; fixable; no split is possible without dropping the accurate ones.)
Google.Will = NO

; "guarantee" is a technical term here (ordering, isolation, transactional
; guarantee) and "simplest"/"best" are engineering judgements, not marketing
; claims.
Google.ExcessiveClaims = NO

; False positives -- the rule cannot tell the true hits from the rest.
; Quotes wants punctuation inside quotation marks, but the docs quote log lines,
; status values, and JSON keys ("running", → "error",), where a comma or period
; inside the quotes would read as part of the quoted value.
Google.Quotes = NO
; Units fires on "200s"/"400s" (plural HTTP status codes, not units) and wants a
; nonbreaking space in durations written as Go duration literals (30s, 200ms) --
; an invisible character in source, next to code that writes 30*time.Second.
Google.Units = NO
; OxfordComma fires on any ", X and Y", which here is usually not a list ("on
; install and on every restart", "directly and through", "discover and persist").
Google.OxfordComma = NO
; The ellipsis is deliberate in the "Read for..." index heading and in truncated
; identifier enumerations (`HEALTH_FAILED`, ...).
Google.Ellipses = NO

; --- Source comments ---------------------------------------------------------
; Vale reads the comments in source files, plus the text of markup and YAML, so
; the house rules apply there too. Only `Bloud` runs on these: the Google style
; is written for prose documents, and identifier-heavy comments drown it.
; `Vale.Avoid`, the rule fed by `reject.txt`, is switched on by name in every
; section below, so the retired-identifier guard covers comments as well as docs.
; Two gaps remain, both covered by `npm run check:no-emdash` instead: string
; literals (Vale never reads them) and `.mjs` (not a format Vale recognises).
[formats]
ts = js
yml = yaml
yaml = yaml
css = css
sql = sql

[*.go]
BasedOnStyles = Bloud
Vale.Avoid = YES

[*.svelte]
BasedOnStyles = Bloud
Vale.Avoid = YES

[*.ts]
BasedOnStyles = Bloud
Vale.Avoid = YES

[*.js]
BasedOnStyles = Bloud
Vale.Avoid = YES

[*.yml]
BasedOnStyles = Bloud
Vale.Avoid = YES

[*.yaml]
BasedOnStyles = Bloud
Vale.Avoid = YES

[*.css]
BasedOnStyles = Bloud
Vale.Avoid = YES

[*.html]
BasedOnStyles = Bloud
Vale.Avoid = YES

[*.sql]
BasedOnStyles = Bloud
Vale.Avoid = YES

; The retired-identifier rule (`reject.txt`) is switched off in the three places
; that document the removals themselves: AGENTS.md invariant 10, the archived
; plan that did the deleting, and the dated review whose staleness list names the
; old unit. Everywhere else, naming a removed component is an error.
[AGENTS.md]
Vale.Avoid = NO

[docs/plans/archive/*.md]
Vale.Avoid = NO

[docs/specs/review-2026-09-19.md]
Vale.Avoid = NO
