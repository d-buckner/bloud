# Lima VM for Bloud local development.
# Creates a Debian 13 (Trixie) VM with podman for running the service stack.
#
# Usage:
#   limactl create --name=bloud-dev dev/lima.yaml
#   limactl start bloud-dev
#   ./bloud dev

images:
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2"
    arch: "aarch64"

vmType: "vz"
cpus: 4
memory: "4GiB"
disk: "30GiB"

mountType: "virtiofs"
mounts:
  - location: "~/Projects/bloud"
    writable: true

portForwards:
  - guestPort: 80     # front proxy (port 80 -> traefik :8080); if host port 80
                      # is busy, Lima picks a free one (see `limactl port`)
  - guestPort: 3000   # host-agent
  - guestPort: 3389   # LDAP outpost (authentik)
  - guestPort: 8080   # traefik
  - guestPort: 8096   # jellyfin
  - guestPort: 9001   # authentik server
  - guestPort: 2283   # immich
  - guestPort: 4533   # navidrome
  - guestPort: 3010   # affine
  - guestPort: 5353  # mDNS: bare guestPort forwards TCP+UDP (Lima's default GRPC
                     # forwarder); macOS' mDNSResponder owns 5353, so Lima may
                     # remap it to a free host port (see `limactl port`)
  - guestPort: 8480   # appflowy

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux

      # Install podman and Go
      apt-get update -qq
      apt-get install -y -qq podman golang-go unzip curl jq ldap-utils

      # Enable lingering for the default user so user-level podman services
      # persist after SSH logout
      loginctl enable-linger "$(id -un 1000)"

      # Front proxy: a root service that owns port 80 and forwards to the
      # rootless Traefik entrypoint (:8080), serving a "starting up" page
      # while the stack boots. The binary is deployed by `./bloud dev` at
      # runtime, so the unit waits for it to appear.
      cat > /etc/systemd/system/bloud-front.service << 'UNIT'
[Unit]
Description=Bloud front proxy (port 80 -> Traefik)
After=network.target
StartLimitIntervalSec=0

[Service]
Type=simple
ExecStart=/bin/bash -c 'while [ ! -x /var/tmp/bloud-dev-runtime/host-agent/host-agent ]; do sleep 2; done; exec /var/tmp/bloud-dev-runtime/host-agent/host-agent front-proxy'
Restart=always
RestartSec=2

[Install]
WantedBy=multi-user.target
UNIT
      systemctl daemon-reload
      systemctl enable --now bloud-front.service
  - mode: user
    script: |
      #!/bin/bash
      set -eux

      # Rootless podman on Lima: cgroupfs manager + k8s-file logging
      mkdir -p ~/.config/containers
      cat > ~/.config/containers/containers.conf << 'CONF'
      [engine]
      cgroup_manager = "cgroupfs"

      [containers]
      log_driver = "k8s-file"
      CONF
