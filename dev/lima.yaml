# Lima VM for Bloud local development.
# Creates a Debian 13 (Trixie) VM with podman for running the service stack.
#
# Usage:
#   limactl create --name=bloud-dev dev/lima.yaml
#   limactl start bloud-dev
#   ./bloud dev

images:
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2"
    arch: "aarch64"

vmType: "vz"
cpus: 4
memory: "4GiB"
disk: "30GiB"

mountType: "virtiofs"
mounts:
  - location: "~/Projects/bloud"
    writable: true

# BEGIN GENERATED DEBUG PORT FORWARDS
# Generated by `./bloud ports --write` from `apps/*/metadata.yaml`. Do not edit by hand.
portForwards:
  - guestPort: 3000 # host-agent API
  - guestPort: 80   # Traefik: the user-facing port
    hostPort: 8080
  - guestPort: 2283 # Immich
  - guestPort: 3010 # AFFiNE
  - guestPort: 3389 # Authentik (ldap)
  - guestPort: 4533 # Navidrome
  - guestPort: 4534 # Navidrome MCP
  - guestPort: 5001 # Podly
  - guestPort: 5055 # Seerr
  - guestPort: 5232 # Radicale
  - guestPort: 6060 # Arr MCP
  - guestPort: 6636 # Authentik (ldap)
  - guestPort: 6881 # qBittorrent
  - guestPort: 7878 # Radarr
  - guestPort: 8000 # Paperless-ngx
  - guestPort: 8081 # qBittorrent
  - guestPort: 8086 # Home Assistant MCP
  - guestPort: 8096 # Jellyfin
  - guestPort: 8123 # Home Assistant
  - guestPort: 8180 # Calino
  - guestPort: 8222 # Vaultwarden
  - guestPort: 8787 # Hermes Web UI
  - guestPort: 8989 # Sonarr
  - guestPort: 9001 # Authentik
  - guestPort: 9002 # Penpot
  - guestPort: 9119 # Hermes
  - guestPort: 9222 # AFFiNE MCP
  - guestPort: 9333 # DAV MCP
  - guestPort: 9696 # Prowlarr
  - guestPort: 9999 # Hindsight
# Not forwarded: 6881 (qbittorrent: host port 6881 already forwards qBittorrent)
# 8080 (traefik: host port 8080 already forwards Traefik: the user-facing port)
# END GENERATED DEBUG PORT FORWARDS

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux

      # Install podman and Go
      apt-get update -qq
      apt-get install -y -qq podman golang-go unzip curl jq ldap-utils

      # Let the rootless Traefik container bind :80 (the canonical entrypoint)
      # in its host network namespace.
      sysctl -w net.ipv4.ip_unprivileged_port_start=0
      echo 'net.ipv4.ip_unprivileged_port_start=0' > /etc/sysctl.d/99-bloud-unprivileged-ports.conf

      # Enable lingering for the default user so user-level podman services
      # persist after SSH logout
      loginctl enable-linger "$(id -un 1000)"
  - mode: user
    script: |
      #!/bin/bash
      set -eux

      # Rootless podman on Lima: cgroupfs manager + k8s-file logging
      mkdir -p ~/.config/containers
      cat > ~/.config/containers/containers.conf << 'CONF'
      [engine]
      cgroup_manager = "cgroupfs"

      [containers]
      log_driver = "k8s-file"
      CONF
