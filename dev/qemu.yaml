# SPDX-License-Identifier: AGPL-3.0-only
# QEMU VM for Bloud local development (x86_64 via KVM on Linux).
#
# This file documents the QEMU backend's spec; the backend hardcodes it (same
# convention as dev/lima.yaml for Lima). Select via `./bloud setup`
# (.bloud/preferences.yaml) or `BLOUD_BACKEND=qemu`:
#
# Runtime artifacts live under .bloud/qemu/<instance>/ (gitignored).
instance: bloud-qemu
arch: x86_64
accel: kvm
machine: q35
cpus: 4
memory: 4GiB
disk: 30GiB
image:
  url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
ssh:
  host: 127.0.0.1
  port: 2222      # hostfwd from guest :22
  user: bloud
mount:
  type: virtio-9p
  tag: host0
  path: "<repo root>"        # auto-detected: the backend mounts the actual checkout at the same path in guest
# BEGIN GENERATED DEBUG PORT FORWARDS
# Generated by `./bloud ports --write` from `apps/*/metadata.yaml`. Do not edit by hand.
portForwards:
  - guestPort: 22   # SSH to the guest
    hostPort: 2222
  - guestPort: 3000 # host-agent API
  - guestPort: 80   # Traefik: the user-facing port
    hostPort: 8080
  - guestPort: 2283 # Immich
  - guestPort: 3010 # AFFiNE
  - guestPort: 3389 # Authentik (ldap)
  - guestPort: 4533 # Navidrome
  - guestPort: 4534 # Navidrome MCP
  - guestPort: 5001 # Podly
  - guestPort: 5055 # Seerr
  - guestPort: 5232 # Radicale
  - guestPort: 6060 # Arr MCP
  - guestPort: 6636 # Authentik (ldap)
  - guestPort: 6881 # qBittorrent
  - guestPort: 7878 # Radarr
  - guestPort: 8000 # Paperless-ngx
  - guestPort: 8081 # qBittorrent
  - guestPort: 8086 # Home Assistant MCP
  - guestPort: 8096 # Jellyfin
  - guestPort: 8123 # Home Assistant
  - guestPort: 8180 # Calino
  - guestPort: 8222 # Vaultwarden
  - guestPort: 8787 # Hermes Web UI
  - guestPort: 8989 # Sonarr
  - guestPort: 9001 # Authentik
  - guestPort: 9002 # Penpot
  - guestPort: 9119 # Hermes
  - guestPort: 9222 # AFFiNE MCP
  - guestPort: 9333 # DAV MCP
  - guestPort: 9696 # Prowlarr
# Not forwarded: 6881 (qbittorrent: host port 6881 already forwards qBittorrent)
# 8080 (traefik: host port 8080 already forwards Traefik: the user-facing port)
# END GENERATED DEBUG PORT FORWARDS
provision:
  - mode: cloud-init  # NoCloud seed: packages + bloud user + lingering + 9p mount
